<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>HSK 3 标准教程 · 练习</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e0d8;
  --red:#c8102e; --red-soft:#fbe9ec; --green:#15803d; --green-soft:#e7f6ec;
  --amber:#b45309; --amber-soft:#fff4e0; --blue:#1d4ed8; --blue-soft:#e8efff;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a; --card:#1f2226; --ink:#e8e6e3; --muted:#9aa0a6; --line:#33373d;
  --red:#ef4d63; --red-soft:#3a1d22; --green:#4ade80; --green-soft:#16301f;
  --amber:#fbbf24; --amber-soft:#35290f; --blue:#7aa2ff; --blue-soft:#1b2640;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%}
.zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","KaiTi",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
header.top{position:sticky;top:0;z-index:10;background:var(--red);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .back{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:6px 10px;color:#fff}
header.top h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .icon{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px}
header.top #home{background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;font-size:18px}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chap{display:block;text-decoration:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;border-left:5px solid var(--red)}
.chap .num{font-size:12px;color:var(--muted);letter-spacing:.05em}
.chap .cn{font-size:18px;margin:4px 0 2px}
.chap .en{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--green)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;scrollbar-width:thin}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
.tabs.wrap a{padding:6px 12px;font-size:13px}
.tabs.wrap .grp{flex-basis:100%;height:0}
.tabs a{flex:none;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.speak{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;flex:none;font-size:15px;line-height:34px;padding:0;text-align:center}
.speak.big{width:52px;height:52px;font-size:22px;line-height:52px}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sechead .roman{font-weight:700;color:var(--red)}
.part-title{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
/* vocab */
table.vocab{width:100%;border-collapse:collapse}
table.vocab td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vocab .w{font-size:22px;white-space:nowrap}
table.vocab .p{color:var(--red);white-space:nowrap}
table.vocab .pos{color:var(--muted);font-size:12px;white-space:nowrap}
.star{border:0;background:none;font-size:18px;color:var(--line);padding:2px}
.star.on{color:#f5b301}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:64px;line-height:1.1}
.flash .py{font-size:22px;color:var(--red);margin-top:8px}
.flash .def{font-size:17px;margin-top:6px}
/* questions */
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-block;min-width:24px;font-weight:600;color:var(--muted)}
.sent{font-size:19px;line-height:1.7}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:17px;text-align:left}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opts.col{flex-direction:column}
.opts.col .opt{width:100%}
.letter{display:inline-block;width:22px;font-weight:700;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:6px}
.bank span{font-size:18px}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--ink);text-align:center;padding:0 4px;color:var(--blue)}
.fb{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.en{color:var(--muted);font-size:14px;margin-top:4px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:18px}
.chip.used{opacity:.25}
.build{min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.build .chip{background:var(--card)}
.score{font-size:30px;font-weight:700}
.stickybar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:9}
.gram .pt{border-left:4px solid var(--red);padding-left:12px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ex .zh{font-size:18px}
input.hz{font-size:22px;width:70px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--card);color:var(--ink)}
.star-mark{color:var(--red);font-weight:700}
.dlg div{font-size:17px;line-height:1.7}
.toggle{font-size:13px;color:var(--blue);background:none;border:0;padding:4px 0}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi .card{flex:1;min-width:140px;margin:0;text-align:center}
.kpi .v{font-size:26px;font-weight:700}
select,input[type=range]{font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat-grid a{text-decoration:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
</style>
</head>

<script>
const DATA = [{"n":1,"cn":"周末你有什么打算","en":"What Are You Planning to Do This Weekend?","vocab":[{"w":"周末","p":"zhōumò","pos":"n.","d":"weekend"},{"w":"打算","p":"dǎsuàn","pos":"n./v.","d":"plan; to plan, intend"},{"w":"啊","p":"a","pos":"part.","d":"ah (sentence-final particle, softens tone/confirms)"},{"w":"跟","p":"gēn","pos":"prep.","d":"with"},{"w":"一直","p":"yìzhí","pos":"adv.","d":"straight on; always, continuously"},{"w":"游戏","p":"yóuxì","pos":"n.","d":"game"},{"w":"作业","p":"zuòyè","pos":"n.","d":"homework"},{"w":"着急","p":"zháojí","pos":"adj.","d":"anxious, worried"},{"w":"复习","p":"fùxí","pos":"v.","d":"to review, revise"},{"w":"南","p":"nán","pos":"n.","d":"south"},{"w":"北方","p":"běifāng","pos":"n.","d":"the north"},{"w":"面包","p":"miànbāo","pos":"n.","d":"bread"},{"w":"带","p":"dài","pos":"v.","d":"to bring, carry, take along"},{"w":"地图","p":"dìtú","pos":"n.","d":"map"},{"w":"搬","p":"bān","pos":"v.","d":"to move (house/objects)"}],"proper":"小丽 (Xiǎo Lì), 小刚 (Xiǎo Gāng) — names of people","grammar":[{"t":"结果补语 \"好\" — The Complement of Result \"好\"","m":"Verb + 好 shows an action was completed thoroughly/satisfactorily (\"done properly,\" \"all set\").","ex":[["电影票也买好了。","The movie tickets have also been bought."],["我已经准备好了。","I've already gotten ready."],["你做好作业了吗？","Have you finished your homework?"]]},{"t":"\"一…… 也/都 + 还/没……\" — The Negative Structure Expressing \"not even one/not at all\"","m":"Emphatic negation — \"not a single one\" or \"not at all.\"","ex":[["一个人也没来。","Not even one person came."],["我一点儿也不冷。","I'm not cold at all."],["这些字，我一个也不认识。","I don't recognize a single one of these characters."]]},{"t":"连词 \"那\" — The Conjunction \"那\" (\"then,\" \"in that case\")","m":"Introduces a consequence/conclusion based on what was just said.","ex":[["你不去，那我也不去了。","If you're not going, then I won't go either."],["那我们明天再说吧。","In that case, let's talk about it again tomorrow."]]}],"ex":{"judge":[{"s":"这个周末我打算跟朋友去北京玩儿，火车票已经买好了。","st":"他还没买火车票。","a":false,"en":"This weekend I plan to go to Beijing with friends; the train tickets are already bought. / He hasn't bought the train tickets yet."},{"s":"我弟弟一直在玩游戏，作业一个字也没写。","st":"弟弟还没写作业。","a":true,"en":"My younger brother has been playing games the whole time and hasn't written a single character of his homework. / The brother hasn't done his homework yet."},{"s":"明天就要考试了，可是我还没复习，真着急啊！","st":"他已经复习好了。","a":false,"en":"The exam is tomorrow, but I haven't reviewed yet — I'm really worried! / He has already finished reviewing."},{"s":"我小时候一直住在南方，去年才搬到北方来。","st":"他现在住在北方。","a":true,"en":"As a child I always lived in the south; I only moved to the north last year. / He now lives in the north."},{"s":"你去那儿别忘了带地图，那儿很大，我第一次去的时候就找不到路。","st":"说话人让对方带地图。","a":true,"en":"Don't forget to bring a map when you go there; it's big there, and I couldn't find my way the first time I went. / The speaker tells the other person to bring a map."}],"listen":[{"dlg":["男：周末你有什么打算？","女：我想在家复习，下个星期就要考试了。"],"q":"女的周末打算做什么？","opts":["去旅游","在家复习","去打球"],"a":1,"en":"M: What are your plans for the weekend? W: I want to review at home; the exam is next week. Q: What does the woman plan to do this weekend?"},{"dlg":["女：你怎么一直在玩游戏？作业做好了吗？","男：已经做好了，您看。"],"q":"关于男的，可以知道什么？","opts":["没有作业","作业太多了","作业做好了"],"a":2,"en":"W: Why do you keep playing games? Have you finished your homework? M: It's already done, have a look. Q: What do we know about the man?"},{"dlg":["男：我饿了，家里有吃的吗？","女：桌子上有面包，你先吃一点儿吧。"],"q":"男的可能会吃什么？","opts":["米饭","面条","面包"],"a":2,"en":"M: I'm hungry, is there anything to eat at home? W: There's bread on the table, eat a little first. Q: What will the man probably eat?"},{"dlg":["女：你们家搬到哪儿了？","男：搬到学校南边了，离我的公司很近。","女：那你以后上班不用坐车了。","男：是啊，走路十分钟就到了。"],"q":"男的家现在在哪儿？","opts":["学校北边","学校南边","公司旁边"],"a":1,"en":"W: Where did your family move to? M: To the south side of the school, very close to my company. W: Then you won't need to take a bus to work any more. M: Right, it's a ten-minute walk. Q: Where is the man's home now?"},{"dlg":["男：别着急，我们还有时间。","女：电影七点开始，现在已经六点五十了！"],"q":"女的为什么着急？","opts":["电影快开始了","她没买票","她找不到地图"],"a":0,"en":"M: Don't worry, we still have time. W: The movie starts at seven and it's already 6:50! Q: Why is the woman anxious?"}],"match":[{"q":"这个周末你有什么打算？","r":"我想跟朋友一起去看电影。"},{"q":"你怎么还在玩游戏？","r":"作业我已经做好了。"},{"q":"外面很冷，你多穿点儿衣服吧。","r":"没关系，我一点儿也不冷。"},{"q":"我不知道去那儿怎么走。","r":"别着急，我带地图了。"},{"q":"我今天不想出去吃饭。","r":"那我们在家做饭吧。"}],"fill":[{"s":"这个（  ）你有什么打算？","a":"周末","en":"What are your plans this weekend?"},{"s":"我（  ）明年去中国学习汉语。","a":"打算","en":"I plan to go to China next year to study Chinese."},{"s":"你（  ）往前走，就能看到医院。","a":"一直","en":"Go straight ahead and you'll see the hospital."},{"s":"我弟弟很喜欢玩电脑（  ），每天都玩两个小时。","a":"游戏","en":"My younger brother loves playing computer games; he plays two hours every day."},{"s":"我家在中国的（  ），冬天很冷。","a":"北方","en":"My home is in the north of China; winters are very cold."},{"s":"A：明天要考试了，你（  ）好了吗？  B：还没有，今天晚上还要再看看书。","a":"复习","en":"A: There's an exam tomorrow — have you finished reviewing? B: Not yet, I still need to read some more tonight."},{"s":"A：别（  ），我们还有十分钟呢。  B：好，那我们慢慢走。","a":"着急","en":"A: Don't worry, we still have ten minutes. B: OK, then let's walk slowly."},{"s":"A：我有点儿饿了。  B：桌子上有（  ），你吃吧。","a":"面包","en":"A: I'm a bit hungry. B: There's bread on the table, go ahead and eat it."},{"s":"A：你出去玩，（  ）钱了吗？  B：带了，在我的包里。","a":"带","en":"A: You're going out — did you bring money? B: Yes, it's in my bag."},{"s":"A：你（  ）家了吗？  B：搬了，现在住在学校旁边。","a":"搬","en":"A: Have you moved house? B: Yes, I live next to the school now."}],"grammar":[{"q":"电影票我已经买（  ）了，我们走吧。","opts":["着","好","去","在"],"a":1,"exp":"Verb + 好 is a result complement meaning the action is completed and ready (tickets are bought and all set).","g":0},{"q":"你准备（  ）了吗？我们要走了。","opts":["着","过","好","在"],"a":2,"exp":"准备好 = 'finished getting ready'; 好 after the verb shows the action is satisfactorily complete.","g":0},{"q":"我今天忙了一天，一口水（  ）没喝。","opts":["还","就","也","很"],"a":2,"exp":"The emphatic negation pattern is 一 + measure (+ noun) + 也/都 + 没/不: 'not even one sip'.","g":1},{"q":"这些字我（  ）个也不认识。","opts":["一","两","几","这"],"a":0,"exp":"Only 一 works in 一……也不……, which means 'not a single one'.","g":1},{"q":"A：我今天不想出去。  B：（  ）我们在家看电视吧。","opts":["因为","虽然","可是","那"],"a":3,"exp":"那 ('in that case') introduces a suggestion based on what the other person just said.","g":2},{"q":"你不想吃米饭，（  ）吃面条吧。","opts":["和","那","跟","也"],"a":1,"exp":"那 links the situation (you don't want rice) to the resulting suggestion (then have noodles).","g":2}],"order":[{"parts":["我明天要考试，","可是还一点儿也没复习，","所以今天晚上不去看电影了。"],"en":"I have an exam tomorrow, but I haven't reviewed at all, so I'm not going to the movies tonight."},{"parts":["我小时候一直住在北方，","十岁的时候跟爸爸妈妈搬到了南方，","现在已经在这儿住了十年了。"],"en":"As a child I always lived in the north; at ten I moved south with my parents, and I've now lived here for ten years."},{"parts":["这个周末天气很好，","我打算跟朋友出去玩儿，","东西我已经准备好了。"],"en":"The weather is nice this weekend; I plan to go out with friends, and I've already got everything ready."},{"parts":["你还没吃饭吧？","我买了一些面包，","你先吃一点儿吧。"],"en":"You haven't eaten yet, right? I bought some bread — have a little first."}],"reading":[{"p":"小丽这个周末打算去北京看她的朋友。火车票她已经买好了，是星期六早上八点的。她还带了一张北京地图，因为她是第一次去北京。","q":"★ 关于小丽，可以知道：","opts":["去过很多次北京","打算坐火车去北京","还没买火车票"],"a":1,"en":"Xiao Li plans to visit her friend in Beijing this weekend. She has already bought the train ticket, for 8 a.m. on Saturday. She is also bringing a map of Beijing because it's her first time going there."},{"p":"我弟弟很喜欢玩游戏。昨天晚上他一直在玩，作业一点儿也没做。今天早上他很着急，因为老师要看作业。","q":"★ 弟弟今天早上为什么着急？","opts":["起床太晚了","游戏玩不好","作业没做"],"a":2,"en":"My younger brother loves playing games. Last night he played the whole time and didn't do any homework. This morning he was very anxious because the teacher wants to check the homework."},{"p":"我小时候住在南方，那儿冬天也不冷。去年我搬到了北方，这儿的冬天很冷，常常下雪。但是我很喜欢这儿，因为可以看到雪。","q":"★ 根据这段话，可以知道说话人：","opts":["现在住在北方","不喜欢下雪","一直住在南方"],"a":0,"en":"As a child I lived （  ）吧。","opts":["去","着","来","过"],"a":2,"exp":"The speaker is downstairs, so movement toward the speaker takes 来.","g":0},{"q":"妈妈在楼上，你把这杯茶拿上（  ）给她吧。","opts":["来","去","到","了"],"a":1,"exp":"Both speakers are downstairs and the tea moves away from them, so 去 is used.","g":0},{"q":"我昨天下了课（  ）去商店了。","opts":["还","才","就","都"],"a":2,"exp":"V1了……就V2 shows the second action happened right after the first; 才 can't be followed by sentence-final 了 here.","g":1},{"q":"他下（  ）课就回家了。","opts":["了","着","过","的"],"a":0,"exp":"了 after the first verb marks its completion before the next action (下了课就……).","g":1},{"q":"这么多东西，我一个人（  ）拿得了吗？","opts":["想","要","能","在"],"a":2,"exp":"能……吗 is a rhetorical question meaning 'How could I possibly carry all this alone?'","g":2},{"q":"你不好好复习，考试（  ）考好吗？","opts":["要","能","想","让"],"a":1,"exp":"能……吗 used rhetorically implies the opposite: 'You can't possibly do well.'","g":2}],"order":[{"parts":["我昨天下了班，","就去医院看了看我的腿，","医生说没什么问题。"],"en":"Yesterday after work I went straight to the hospital to have my leg checked; the doctor said there was no problem."},{"parts":["外面下雨了，","你出去的时候","别忘了带伞。"],"en":"It's raining outside; don't forget to take an umbrella when you go out."},{"parts":["大家都觉得他很胖，","其实他小时候很瘦，","是这两年才胖的。"],"en":"Everyone thinks he's fat, but actually he was thin as a child; he only put on weight in the last two years."},{"parts":["这么多作业，","我一个人","能做完吗？"],"en":"With so much homework, how could I finish it all by myself?"}],"reading":[{"p":"周明是公司的经理，他每天都很忙。今天上午他在办公室开了三个会，下午又去了一个很远的公司。","q":"★ 周明今天：","opts":["在家休息","很忙","没去公司"],"a":1,"en":"Zhou Ming is a company manager and is busy every day. This morning he had three meetings in the office, and in the afternoon he went to a company far away."},{"p":"我家楼前有很多树。天气好的时候，很多孩子在树下玩儿，我也常常带我的小狗去那儿。","q":"★ 天气好的时候，楼前：","opts":["有很多车","有很多孩子","没有人"],"a":1,"en":"There are many trees in front of my building. When the weather is nice, lots of children play under the trees, and I often take my little dog there too."},{"p":"很多人觉得汉字很难，其实汉字也不难。你每天认识几个，每天写一写，时间长了，就容易了。","q":"★ 说话人觉得汉字：","opts":["很难","太多了","不太难"],"a":2,"en":"Many people think Chinese characters are hard, but actually they aren't. Learn a few every day and write them every day; over time it gets easy."},{"p":"周太太去年很瘦，今年她每天吃很多面包，也不运动，现在胖了很多。","q":"★ 周太太为什么胖了？","opts":["吃得多，也不运动","工作太忙","生病了"],"a":0,"en":"Mrs. Zhou was very thin last year. This year she has eaten lots of bread every day and didn't exercise, and now she has put on a lot of weight."}],"write":[{"words":["他","什么时候","回来？"],"en":"When will he come back?"},{"words":["你","把伞","拿来","吧。"],"en":"Bring the umbrella here."},{"words":["他","下了班","就","回家了。"],"en":"He went home right after work."},{"words":["其实","这个题","一点儿也","不难。"],"en":"Actually this question isn't hard at all."},{"words":["楼下","有","一辆","红色的车。"],"en":"There's a red car downstairs."}],"hanzi":[{"s":"我走了很多路，现在（  ）很疼。","py":"tuǐ","a":"腿"},{"s":"外面下雨了，别忘了带（  ）。","py":"sǎn","a":"伞"},{"s":"他去年很（  ），现在胖了。","py":"shòu","a":"瘦"},{"s":"经理在（  ）公室等你。","py":"bàn","a":"办"},{"s":"这个问题不（  ），我知道怎么做。","py":"nán","a":"难"}]},"rv":{"judge":[{"s":"王经理的秘书今天生病了，没来上班。","st":"秘书今天在办公室。","a":false,"en":"Manager Wang's secretary is ill today and didn't come to work. / The secretary is in the office today."},{"s":"我家住在六楼，我每天都是走上去的。","st":"他每天走路上楼。","a":true,"en":"I live on the sixth floor and walk up every day. / He walks upstairs every day."},{"s":"这把伞是我太太的，我的伞在办公室里。","st":"这把伞是说话人的。","a":false,"en":"This umbrella is my wife's; mine is in the office. / This umbrella belongs to the speaker."},{"s":"我小时候很胖，上了中学就开始每天跑步，现在瘦多了。","st":"说话人现在比小时候瘦。","a":true,"en":"I was fat as a child; after starting middle school I began running every day, and now I'm much thinner. / The speaker is thinner now than as a child."}],"listen":[{"dlg":["男：你的脚怎么了？","女：昨天踢足球的时候有点儿疼，今天好多了。"],"q":"女的昨天做什么了？","opts":["跑步","游泳","踢足球"],"a":2,"en":"M: What's wrong with your foot? W: It hurt a bit while playing football yesterday; it's much better today. Q: What did the woman do yesterday?"},{"dlg":["女：楼下那棵树真高啊！","男：是啊，我们搬来的时候它就这么高了。"],"q":"他们在说什么？","opts":["树","楼","车"],"a":0,"en":"W: That tree downstairs is really tall! M: Yes, it was already this tall when we moved here. Q: What are they talking about?"},{"dlg":["女：周经理，您太太来了，在楼下等您。","男：好，你让她上来吧。"],"q":"周经理的太太现在在哪儿？","opts":["办公室","楼下","家里"],"a":1,"en":"W: Manager Zhou, your wife is here, waiting for you downstairs. M: OK, let her come up. Q: Where is Manager Zhou's wife now?"},{"dlg":["女：你下了班就回家吗？","男：不，我先去医院看看腿，看完了再回家。"],"q":"男的下了班先去哪儿？","opts":["回家","去医院","去公司"],"a":1,"en":"W: Are you going home right after work? M: No, I'll first go to the hospital to have my leg checked, then go home. Q: Where does the man go first after work?"}],"fill":[{"s":"这个题很（  ），我五分钟就做完了。","a":"容易","en":"This question is easy; I finished it in five minutes."},{"s":"房间里只有一（  ）椅子。","a":"把","en":"There is only one chair in the room."},{"s":"你太（  ）了，要多吃点儿饭。","a":"瘦","en":"You're too thin; you should eat more."},{"s":"小李，请到我的（  ）来一下，我有事跟你说。","a":"办公室","en":"Xiao Li, please come to my office; I have something to tell you."},{"s":"王先生和他（  ）有两个孩子。","a":"太太","en":"Mr Wang and his wife have two children."},{"s":"A：这双鞋你能穿吗？  B：不能，我的（  ）太大了。","a":"脚","en":"A: Can you wear these shoes? B: No, my feet are too big."}],"grammar":[{"q":"我在房间里等你，你快进（  ）吧。","opts":["来","去","着","了"],"a":0,"exp":"The speaker is inside, so the motion is toward the speaker: 进来.","g":0},{"q":"我在楼下等你，哥哥在楼上，你先上（  ）找他吧。","opts":["来","去","过","着"],"a":1,"exp":"The speaker is downstairs and the listener moves away from the speaker: 上去.","g":0},{"q":"他吃了早饭（  ）去上班了。","opts":["还","再","都","就"],"a":3,"exp":"V1 了 + O, 就 + V2 shows the second action happened right after the first.","g":1},{"q":"你到（  ）机场就给我打电话。","opts":["着","过","了","的"],"a":2,"exp":"了 after the first verb marks its completion before the next action (就 + V2).","g":1},{"q":"他的腿这么疼，（  ）去踢足球吗？","opts":["能","在","得","正"],"a":0,"exp":"能……吗？ is a rhetorical question meaning 'of course he can't'.","g":2},{"q":"这么难的题，一年级的学生（  ）做对吗？","opts":["要","能","在","着"],"a":1,"exp":"Rhetorical 能……吗？ implies first-years can't possibly get it right.","g":2}],"order":[{"parts":["经理下了飞机，","就给秘书打了电话，","说他下午回公司。"],"en":"As soon as the manager got off the plane he called his secretary to say he'd be back at the company in the afternoon."},{"parts":["今天走了很多路，","我的腿和脚都很疼，","明天不想出去了。"],"en":"I walked a lot today; my legs and feet hurt, so I don't want to go out tomorrow."},{"parts":["很多人觉得开车很难，","其实一点儿也不难，","我学了两个星期就会了。"],"en":"Many people think driving is hard, but actually it's not hard at all; I learned in two weeks."}],"reading":[{"p":"王太太每天早上下了楼就去跑步，跑一个小时再回家吃早饭。她说每天跑步以后，腿不疼了，人也瘦了。","q":"★ 王太太每天早上先做什么？","opts":["跑步","吃早饭","去上班"],"a":0,"en":"Every morning Mrs Wang goes running as soon as she comes downstairs, runs for an hour and then goes home for breakfast. She says since running every day her legs don't hurt and she's lost weight."},{"p":"小张是李经理的秘书。经理的办公室在十楼，小张的办公室在九楼。经理有事的时候，就给小张打电话，小张就上去。","q":"★ 小张的办公室在几楼？","opts":["十楼","八楼","九楼"],"a":2,"en":"Xiao Zhang is Manager Li's secretary. The manager's office is on the 10th floor, Xiao Zhang's on the 9th. When the manager needs something he calls Xiao Zhang, who goes up."},{"p":"很多人觉得学游泳很难，其实不太难。我妹妹今年六岁，她学了一个星期就会游了。","q":"★ 根据这段话，可以知道：","opts":["妹妹不会游泳","游泳不太难","妹妹学了一个月"],"a":1,"en":"Many people think learning to swim is hard, but actually it's not very hard. My sister is six and she could swim after one week of lessons."}],"write":[{"words":["他的","办公室","在","五楼。"],"en":"His office is on the fifth floor."},{"words":["我","下了课","就去","找你。"],"en":"I'll come find you right after class."},{"words":["你的腿","这么疼，","能走路吗？"],"en":"Your leg hurts so much — how can you walk?"},{"words":["那辆","黑色的车","是经理的。"],"en":"That black car is the manager's."}],"hanzi":[{"s":"我的（  ）很疼，走不了路。","py":"jiǎo","a":"脚"},{"s":"我的头有点儿（  ）。","py":"téng","a":"疼"},{"s":"这件事不（  ）易，你要好好准备。","py":"róng","a":"容"},{"s":"我家有一（  ）黑色的车。","py":"liàng","a":"辆"}]}},{"n":3,"cn":"桌子上放着很多饮料","en":"There Are Lots of Drinks on the Table","vocab":[{"w":"还是","p":"háishì","pos":"adv./conj.","d":"or [used in questions]"},{"w":"爬山","p":"páshān","pos":"v.","d":"to climb hills/mountains, hiking"},{"w":"小心","p":"xiǎoxīn","pos":"v./adj.","d":"to be careful, take care"},{"w":"条","p":"tiáo","pos":"m.","d":"measure word for long thin things (trousers, rivers, etc.)"},{"w":"裤子","p":"kùzi","pos":"n.","d":"trousers, pants"},{"w":"记得","p":"jìde","pos":"v.","d":"to remember"},{"w":"衬衫","p":"chènshān","pos":"n.","d":"shirt"},{"w":"元","p":"yuán","pos":"m.","d":"yuan (unit of Chinese currency)"},{"w":"新鲜","p":"xīnxiān","pos":"adj.","d":"fresh"},{"w":"甜","p":"tián","pos":"adj.","d":"sweet"},{"w":"只","p":"zhǐ","pos":"adv.","d":"only, merely"},{"w":"放","p":"fàng","pos":"v.","d":"to put, place; to set free"},{"w":"饮料","p":"yǐnliào","pos":"n.","d":"drink, beverage"},{"w":"或者","p":"huòzhě","pos":"conj.","d":"or [used in statements]"},{"w":"舒服","p":"shūfu","pos":"adj.","d":"comfortable"},{"w":"花","p":"huā","pos":"n.","d":"flower"},{"w":"绿","p":"lǜ","pos":"adj.","d":"green"}],"proper":"","grammar":[{"t":"\"还是\" 和 \"或者\" — Comparison of \"还是\" and \"或者\" (both mean \"or\")","m":"还是 is used in questions (choice-type questions); 或者 is used in statements (not in questions).","ex":[["你喝茶还是喝咖啡？","Do you want tea or coffee? — question"],["你可以喝茶，或者喝咖啡。","You can drink tea, or coffee. — statement"]]},{"t":"存在的表达: Location + V着 + Numeral + Measure Word + N — The Expression of Existence","m":"States that something exists/is located somewhere, with the verb marked by 着 to show a continuing state.","ex":[["桌子上放着很多饮料。","There are a lot of drinks placed on the table."],["墙上挂着一张地图。","A map is hanging on the wall."],["门口站着两个人。","Two people are standing at the doorway."]]},{"t":"\"会\" 表示可能 — \"会\" Indicating Possibility","m":"会 used (not for \"know how to\") to express that something is likely/possible to happen.","ex":[["明天会下雨。","It might rain tomorrow."],["他会来的，别担心。","He will come, don 时候怎么样？","opts":["很胖","很漂亮","很热情"],"a":1,"en":"W: Look, whose photo is this? M: It's my mum's; she was very pretty when she was young. Q: What does the man think his mother was like when young?"},{"dlg":["男：你怎么了？","女：我中午没吃饭，现在又饿又累。"],"q":"女的现在怎么样？","opts":["又饿又累","不想吃饭","很高兴"],"a":0,"en":"M: What's wrong? W: I didn't eat lunch, and now I'm both hungry and tired. Q: How is the woman now?"},{"dlg":["女：你们班的新同学怎么样？","男：他很聪明，也很努力，老师问的问题他都能回答。"],"q":"关于新同学，可以知道什么？","opts":["不认真","总是不来上课","很聪明"],"a":2,"en":"W: What's the new student in your class like? M: He's very clever and hard-working; he can answer all the teacher's questions. Q: What do we know about the new student?"},{"dlg":["男：我们去超市买点儿东西吧。","女：好啊，我想买一个蛋糕，明天是我妹妹的生日。","男：那我们再买点儿水果吧。","女：好的。"],"q":"女的为什么要买蛋糕？","opts":["她饿了","妹妹过生日","家里来客人了"],"a":1,"en":"M: Let's go to the supermarket to buy some things. W: OK, I want to buy a cake — tomorrow is my younger sister's birthday. M: Then let's buy some fruit too. W: Sure. Q: Why does the woman want to buy a cake?"},{"dlg":["女：你怎么站着吃饭？","男：椅子上都是书，我不能坐。"],"q":"男的为什么站着吃饭？","opts":["椅子上有书","他喜欢站着","他很忙"],"a":0,"en":"W: Why are you eating standing up? M: The chairs are covered with books; I can't sit down. Q: Why is the man eating standing up?"}],"match":[{"q":"你们的汉语老师怎么样？","r":"她很年轻，也很热情。"},{"q":"你看，那个孩子多聪明啊！","r":"是啊，老师问什么他都能回答。"},{"q":"我饿了，有吃的吗？","r":"桌子上有蛋糕，你吃吧。"},{"q":"你弟弟上几年级了？","r":"他今年上小学二年级。"},{"q":"明天的比赛你去看吗？","r":"去，我跟同学一起去。"}],"fill":[{"s":"我弟弟今年上小学三（  ）。","a":"年级","en":"My younger brother is in the third grade of primary school this year."},{"s":"这是我小时候的（  ），你看我那时候多胖啊。","a":"照片","en":"This is a photo of me as a child — look how chubby I was then."},{"s":"明天有足球（  ），我们一起去看吧。","a":"比赛","en":"There's a football match tomorrow; let's go and watch it together."},{"s":"我中午没吃饭，现在很（  ）。","a":"饿","en":"I didn't eat lunch, so I'm very hungry now."},{"s":"我常常去楼下的（  ）买东西。","a":"超市","en":"I often go to the supermarket downstairs to buy things."},{"s":"A：今天是你的生日，我给你买了一个（  ）。  B：谢谢 am."},{"parts":["家里来了很多客人，","椅子不够，","有的人只能站着说话。"],"en":"Lots of guests came to the house and there weren't enough chairs, so some people had to talk standing up."}],"reading":[{"p":"李小美是我们班的学生，她又聪明又努力，学习很认真。老师问的问题，她总是第一个回答。","q":"★ 关于李小美，可以知道：","opts":["不喜欢回答问题","学习很好","是老师"],"a":1,"en":"Li Xiaomei is a student in our class. She's clever and hard-working and studies conscientiously. She's always the first to answer the teacher's questions."},{"p":"我妈妈在一个超市工作，她对客人很热情，总是笑着跟他们说话。客人们都很喜欢她。","q":"★ 妈妈在哪儿工作？","opts":["饭店","学校","超市"],"a":2,"en":"My mum works in a supermarket. She's very warm to customers and always talks to them with a smile. The customers all like her."},{"p":"这是我们上一年级的时候照的照片。那时候我们都很年轻，照片里站着的是我，坐着的是我的好朋友。","q":"★ 照片里站着的是谁？","opts":["说话人","说话人的朋友","老师"],"a":0,"en":"This is a photo taken when we were in first year. We were all young then. The one standing in the photo is me; the one sitting is my good friend."},{"p":"昨天下午有足球比赛，我们班的同学踢得很努力。比赛完了以后，大家又饿又累，一起去饭店吃了饭。","q":"★ 比赛以后，大家：","opts":["都回家了","去饭店吃饭了","又去踢球了"],"a":1,"en":"There was a football match yesterday afternoon, and our class played very hard. After the match everyone was hungry and tired, so we went to a restaurant to eat together."}],"write":[{"words":["她","又聪明","又","热情。"],"en":"She is both clever and warm."},{"words":["她","总是","笑着","跟客人说话。"],"en":"She always talks to guests with a smile."},{"words":["我","又饿","又累。"],"en":"I'm both hungry and tired."},{"words":["爸爸","喜欢","坐着","看报纸。"],"en":"Dad likes to read the newspaper sitting down."},{"words":["我弟弟","今年","上","三年级。"],"en":"My younger brother is in third grade this year."}],"hanzi":[{"s":"我中午没吃饭，现在很（  ）。","py":"è","a":"饿"},{"s":"他学习很认（  ）。","py":"zhēn","a":"真"},{"s":"这个孩子很（  ）明。","py":"cōng","a":"聪"},{"s":"他（  ）在门口等你。","py":"zhàn","a":"站"},{"s":"我去超（  ）买点儿水果。","py":"shì","a":"市"}]},"rv":{"judge":[{"s":"我们家楼下新开了一个超市，那儿的东西又新鲜又便宜。","st":"那个超市的东西很贵。","a":false,"en":"A new supermarket has opened downstairs; its things are fresh and cheap. / That super 班，","十几分钟就到了，","比坐公共汽车方便多了。"],"en":"I cycle to work every day; it takes ten-odd minutes and is much more convenient than taking the bus."}],"reading":[{"p":"我家附近有一个大公园，环境特别好。每天早上都有很多老人在那儿锻炼身体，晚上也有很多人在那儿跑步。","q":"★ 这个公园：","opts":["人很少","环境很好","离他家很远"],"a":1,"en":"There's a big park near my home with a really nice environment. Every morning lots of elderly people exercise there, and in the evening many people go running there."},{"p":"我上学的时候，最喜欢体育，最不喜欢数学。我觉得数学比历史难多了，每次考试都考得不好。","q":"★ 他上学的时候：","opts":["最喜欢数学","数学考得很好","觉得数学很难"],"a":2,"en":"When I was at school, I liked PE best and maths least. I thought maths was much harder than history, and I did badly in every exam."},{"p":"我想换个房子，就去找中介。中介带我看了七八个房子，最后我觉得一个离公司近的房子最好，虽然有点儿旧，但是比较便宜。","q":"★ 他最后觉得哪个房子最好？","opts":["最新的","离公司近的","最大的"],"a":1,"en":"I wanted to move, so I went to an agency. The agent showed me seven or eight flats; in the end I thought the one close to my office was best — a bit old, but fairly cheap."},{"p":"上班的时候我主要骑自行车，因为骑车比开车方便多了，也能锻炼身体。","q":"★ 他为什么骑自行车上班？","opts":["没有钱买车","不会开车","方便，也能锻炼身体"],"a":2,"en":"I mainly cycle to work, because cycling is much more convenient than driving, and it's also exercise."}],"write":[{"words":["数学","比","历史","难多了。"],"en":"Maths is much harder than history."},{"words":["他","个子","比我","矮一点儿。"],"en":"He is a little shorter than me."},{"words":["我家","附近","有","一个公园。"],"en":"There is a park near my home."},{"words":["教室里","有","十几个","学生。"],"en":"There are a dozen or so students in the classroom."},{"words":["我","每天","骑自行车","上班。"],"en":"I ride my bike to work every day."}],"hanzi":[{"s":"我每天（  ）自行车上班。","py":"qí","a":"骑"},{"s":"这件衣服太（  ）了，我想买件新的。","py":"jiù","a":"旧"},{"s":"我想（  ）个地方住。","py":"huàn","a":"换"},{"s":"这里的环（  ）很好。","py":"jìng","a":"境"},{"s":"我家（  ）近有一个超市。","py":"fù","a":"附"}]},"rv":{"judge":[{"s":"我的新房子比旧的大多了，可是离公司远了一些，每天要骑四十分钟自行车。","st":"新房子比旧房子小。","a":false,"en":"My new flat is much bigger than the old one, but a bit further from the office; I have to cycle forty minu ","en":"I study Chinese mainly because I'm interested in Chinese history."},{"s":"这儿的（  ）很好，有很多树，也很安静。","a":"环境","en":"The environment here is very nice — lots of trees, and very quiet."},{"s":"A：坐公共汽车去机场（  ）吗？  B：很方便，门口就有车站。","a":"方便","en":"A: Is it convenient to take the bus to the airport? B: Very — there's a stop right by the door."},{"s":"A：你为什么总是坐在前面？  B：因为我个子（  ），坐在后面看不见老师。","a":"矮","en":"A: Why do you always sit at the front? B: Because I'm short; if I sit at the back I can't see the teacher."}],"grammar":[{"q":"这件衣服比那件贵（  ）。","opts":["很","一点儿","非常","太"],"a":1,"exp":"In a 比 sentence the difference goes after the adjective (贵一点儿); 很/非常/太 can't be used.","g":0},{"q":"他跑得比我快（  ）。","opts":["真","非常","特别","多了"],"a":3,"exp":"Adj + 多了 after a 比 comparison means 'much more'; degree adverbs like 真/非常/特别 aren't allowed.","g":0},{"q":"我的房间比你的（  ）。","opts":["很大","大一些","非常大","太大了"],"a":1,"exp":"比 sentences take Adj + 一些/一点儿/多了, never 很/非常/太.","g":0},{"q":"我们学校有（  ）个外国老师。","opts":["几个十","十几","十个几","几十几"],"a":1,"exp":"十几 = 'ten-odd' (11–19), the standard way to use 几 for an approximate number.","g":1},{"q":"这个问题我想了（  ）天，还是不明白。","opts":["两三个","第二三","两三","两个三"],"a":2,"exp":"Two neighbouring numbers give an approximation (两三天); 天 takes no measure word, so 两三个天 is wrong.","g":1},{"q":"我比我哥哥（  ）一点儿。","opts":["很矮","矮","非常矮","真矮"],"a":1,"exp":"A 比 B + Adj + 一点儿: the adjective can't carry 很/非常/真 in a 比 sentence.","g":0}],"order":[{"parts":["我家附近新开了一个超市，","东西比别的地方便宜一些，","所以每天都有很多人去买东西。"],"en":"A new supermarket has opened near my home; things are a bit cheaper than elsewhere, so lots of people go shopping there every day."},{"parts":["我弟弟个子比较矮，","但是他特别喜欢打篮球，","每天下午都要打一两个小时。"],"en":"My younger brother is rather short, but he loves basketball and plays for one or two hours every afternoon."},{"parts":["小时候我最喜欢上体育课，","因为可以在外边跑跑跳跳，","比在教室里坐着有意思多了。"],"en":"As a child I liked PE best, because I could run and jump around outside — much more fun than sitting in the classroom."}],"reading":[ /* ---------- speech ---------- */
let VOICES = [];
function loadVoices(){ VOICES = (speechSynthesis.getVoices() || []).filter(v => /^zh(-|_)?(CN|Hans)?/i.test(v.lang) || /Chinese|中文|普通话/i.test(v.name)); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(g){
  if (!VOICES.length) return null;
  const cn = VOICES.filter(v => /CN|Hans/i.test(v.lang)); const pool = cn.length ? cn : VOICES;
  if (S.set.voice){ const v = pool.find(v => v.name === S.set.voice); if (v && !g) return v; }
  const male = pool.find(v => /Yunxi|Yunyang|Kangkang|Male|男|Yunjian|Li-mu|Tian-Tian(?!.)/i.test(v.name));
  const fem = pool.find(v => /Xiaoxiao|Huihui|Yaoyao|Ting-?Ting|Female|女|Xiaoyi|Mei-Jia/i.test(v.name));
  if (g === 'm') return male || pool[0];
  if (g === 'f') return fem || pool[0];
  return pool[0];
}
function say(text, opts = {}){
  if (!('speechSynthesis' in window)) { alert('Speech is not supported in this browser.'); return; }
  speechSynthesis.cancel();
  const lines = Array.isArray(text) ? text : [text];
  lines.forEach(line => {
    let g = null, t = line;
    const m = /^(男|女)[：:]/.exec(line); if (m){ g = m[1] === '男' ? 'm' : 'f'; t = line.slice(2); }
    t = t.replace(/[（(]\s*[）)]/g, '什么').replace(/★/g, '');
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = S.set.rate; const v = pickVoice(g); if (v) u.voice = v;
    if (g === 'm' && v && !/Yunxi|Yunyang|Kangkang|Male|Yunjian/i.test(v.name)) u.pitch = .7;
    if (g === 'f') u.pitch = 1.1;
    speechSynthesis.speak(u);
  });
}
const spk = (t, big) => `<button class="speak ${big ? 'big' : ''}" data-say='${esc(JSON.stringify(t))}' title="Play">🔊</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.preventDefault(); say(JSON.parse(b.dataset.say)); } });

  const b = S.best[n] || {}; const keys = [...SECTIONS.map(s => s.k), 'vquiz'];
  const done = keys.reduce((a, k) => a + (b[k] ?? 0), 0);
  return Math.round(done / keys.length);
}

function addMistake(n, k, i, src = 'ex'){ if (!S.mistakes.some(m => m.n == n && m.k == k && m.i == i && srcOf(m) === src)){ S.mistakes.push(src === 'ex' ? {n, k, i} : {n, k, i, src}); save(); } }
function clearMistake(n, k, i, src = 'ex'){ S.mistakes = S.mistakes.filter(m => !(m.n == n && m.k == k && m.i == i && srcOf(m) === src)); save(); }

}

    $('#app').innerHTML = head + `
      <div class="row small muted" style="margin-bottom:6px"><span>${i + 1} / ${deck.length}</span><span style="flex:1"></span>
      正面 Front: <select id="front"><option value="hz">汉字</option><option value="en" ${front==='en'?'selected':''}>English</option></select></div>
      <div class="card flash" id="fc">${fr}${flipped ? (front === 'hz' ? back : hz + back) : '<div class="small muted" style="margin-top:14px">tap to flip</div>'}
      <div style="margin-top:12px">${spk(v.w, true)}</div></div>`;
    $('#fc').onclick = e => { if (e.target.closest('[data-say]')) return; flipped = !flipped; if (flipped) say(v.w); draw(); };
    $('#front').onchange = e => { S.set.cardFront = e.target.value; save(); flashcards(list, head, onDone); };
    setBar(flipped ? `<button class="btn" id="no">✗ 不认识 Again</button><button class="btn primary" id="yes">✓ 认识 Know it</button>` : `<button class="btn primary" id="flip">翻转 Flip</button>`);
    if (flipped){ $('#no').onclick = () => { srsGrade(v.n, v.w, false); i++; flipped = false; draw(); };
                  $('#yes').onclick = () => { srsGrade(v.n, v.w, true); known++; i++; flipped = false; draw(); }; }
    else $('#flip').onclick = () => { flipped = true; say(v.w); draw(); };
  }
  draw();
}

function makeVQ(n){
  const c = CH[n]; const pool = c.vocab.length >= 4 ? c.vocab : c.vocab.concat(CH[n - 1]?.vocab || []);
  const near = [...pool, ...(CH[n - 1]?.vocab || []), ...(CH[n + 1]?.vocab || [])];
  const uniq = (arr, f) => [...new Map(arr.map(x => [f(x), x])).values()];
  return shuffle(c.vocab).map((v, i) => {
    const type = ['hz2en', 'en2hz', 'hz2py', 'audio'][i % 4];
    const others = sample(uniq(near.filter(x => x.w !== v.w && x.d !== v.d && x.p !== v.p), x => x.w), 3);
    const opts = shuffle([v, ...others]);
    const label = x => type === 'hz2en' ? x.d : type === 'hz2py' ? x.p : x.w;
    const prompt = type === 'hz2en' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">是什么意思？</span>`
      : type === 'en2hz' ? `<span style="font-size:18px">“${esc(v.d)}”</span> <span class="muted small">用汉语怎么说？</span>`
      : type === 'hz2py' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">怎么读？ pinyin?</span>`
      : `${spk(v.w, true)} <span class="muted small">听录音，选汉字 Listen and pick</span>`;
    return {v, type, prompt, opts: opts.map(label), a: opts.indexOf(v)};
  });
}
function vquiz(n, head){
  const qs = makeVQ(n); let i = 0, right = 0, answered = false;
  function draw(){
    if (i >= qs.length){ const pct = Math.round(right / qs.length * 100); setBest(n, 'vquiz', pct);
      $('#app').innerHTML = head + `<div class="card" style="text-align:center"><div class="score">${pct}%</div><p>${right} / ${qs.length}</p><button class="btn primary" onclick="route()">再测一次 Retry</button></div>`; setBar(''); return; }
    const q = qs[i]; answered = false;
    $('#app').innerHTML = head + `<div class="card"><div class="small muted">${i + 1} / ${qs.length}</div>
      <div style="margin:14px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${q.prompt}</div>
      <div class="opts col">${q.opts.map((o, j) => `<button class="opt ${q.type === 'hz2en' ? '' : 'zh'}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    if (q.type === 'audio') setTimeout(() => say(q.v.w), 250);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true; const j = +b.dataset.j; const ok = j === q.a;
      if (ok) right++; srsGrade(n, q.v.w, ok);
      document.querySelectorAll('.opt').forEach((x, k) => { if (k === q.a) x.classList.add('right'); else if (k === j) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><span class="zh">${esc(q.v.w)}</span> ${esc(q.v.p)} — ${esc(q.v.d)}</div>`;
      if (q.type !== 'audio') say(q.v.w);
      setBar(`<button class="btn primary" id="next">下一题 Next ›</button>`); $('#next').onclick = () => { i++; setBar(''); draw(); };
    });
  }
  draw();
}

/* ----- grammar ----- */
function grammar(n){

      ${g.ex.map(([z, e]) => `<div class="ex">${spk(z)}<div><div class="zh">${esc(z)}</div><div class="en">${esc(e)}</div></div></div>`).join('')}
      ${ex.some(q => q.g === gi) ? `<button class="btn" data-gp="${gi}" style="margin-top:6px">练一练 Practise this point (${ex.filter(q => q.g === gi).length})</button><div id="gp${gi}"></div>` : ''}
    </div>`).join('') + `<div class="row"><a class="btn primary" style="text-decoration:none" href="#/ch/${n}/wb/grammar">本课语法练习 All grammar exercises for this lesson ›</a></div>`;

/* ----- workbook ----- */
function workbook(n, k){
  const c = CH[n]; setTitle(`第${n}课 练习册`, true);
  const secs = k ? [SECT[k]] : SECTIONS;
  let lastGrp = '';
  const sub = `<div class="tabs wrap" style="margin-top:-4px">${[['', '全部 All'], ...SECTIONS.map(s => [s.k, SHORT[s.k]])].map(([kk, l]) => `<a class="${(k||'') === kk ? 'on' : ''}" href="#/ch/${n}/wb${kk ? '/' + kk : ''}">${l}</a>`).join('')}</div>`;
  $('#app').innerHTML = tabs(n, 'wb') + sub + secs.map(s => {
    const g = s.grp !== lastGrp ? `<div class="sechead"><span class="roman">${s.roman}、</span><span class="part-title">${s.grp}</span></div>` : ''; lastGrp = s.grp;
    return g + `<div class="card" id="sec-${s.k}"></div>`; }).join('');
  secs.forEach(s => runSection(n, s.k, $('#sec-' + s.k)));
}

function runSection(n, k, el, o = {}){
  const c = CH[n]; const all = (o.src === 'rv' ? c.rv : c.ex)?.[k] || [];
  const idx = o.only || all.map((_, i) => i);
  const items = idx.map(i => { const it = {...all[i], _i: i};
    if (it.opts && ['listen', 'reading', 'grammar'].includes(k)){ const ord = shuffle(it.opts.map((_, j) => j)); it.opts = ord.map(j => all[i].opts[j]); it.a = ord.indexOf(all[i].a); }
    return it; });
  const s = SECT[k];
  if (!items.length){ el.innerHTML = `<div class="muted">No exercises yet.</div>`; return; }
  const st = {ans: {}, checked: false};
  const ctx = {n, k, items, st, el, s, o};
  RENDER[k](ctx);
}
function header(ctx, extra = ''){
  const {s, n, k, o} = ctx; if (o.inline) return '';
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><div class="part-title zh">${s.t}</div><div class="small muted">${s.en}</div></div>${o.mistakes || o.review ? '' : pill(S.best[n]?.[k])}</div>${extra}`;
}
function footer(ctx){
  if (ctx.o.review) return `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>检查 Check</button><span data-score class="part-title"></span></div>`;
  return `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>检查 Check</button><button class="btn ghost" data-reset>重做 Redo</button><span data-score class="part-title"></span>
    ${ctx.o.inline || ctx.o.mistakes ? '' : `<label class="small muted" style="margin-left:auto"><input type="checkbox" data-en ${S.set.en ? 'checked' : ''}> English</label>`}</div>`;
}
function wire(ctx, grade){
  const {el, st, items, n, k, o} = ctx;
  el.querySelector('[data-check]').onclick = () => {
    if (o.review && st.checked) return;
    if (o.review && !o.answered(ctx)) { el.querySelector('[data-score]').textContent = '请先作答 Answer first'; return; }
    st.checked = true; let right = 0;
    const src = o.src || 'ex';
    items.forEach((it, qi) => { const ok = grade(it, qi); if (ok) right++;
      if (ok) clearMistake(n, k, it._i, src); else addMistake(n, k, it._i, src); });
    const pct = Math.round(right / items.length * 100);
    if (!o.only && !o.mistakes && !o.review) setBest(n, k, pct);
    el.querySelector('[data-score]').textContent = o.review ? (right ? '✓ 对了 Correct' : '✗ 错了 Not quite') : `${right} / ${items.length}`;
    if (o.review) el.querySelector('[data-check]').disabled = true;
    el.querySelectorAll('.en').forEach(x => x.classList.remove('hidden'));
    el.querySelectorAll('[data-reveal]').forEach(x => x.classList.remove('hidden'));
    o.onGraded?.(right, items.length);
  };
  const rs = el.querySelector('[data-reset]'); if (rs) rs.onclick = () => RENDER[k]({...ctx, st: {ans: {}, checked: false}});
  const en = el.querySelector('[data-en]'); if (en) en.onchange = e => { S.set.en = e.target.checked; save(); el.querySelectorAll('.en').forEach(x => x.classList.toggle('hidden', !S.set.en && !ctx.st.checked)); };
}
const enLine = t => t ? `<div class="en ${S.set.en ? '' : 'hidden'}">${esc(t)}</div>` : '';
function optClicks(ctx, sel = '.opt'){
  ctx.el.querySelectorAll(sel).forEach(b => b.onclick = () => {
    if (ctx.st.checked) return; const q = b.dataset.q;
    ctx.el.querySelectorAll(`${sel}[data-q="${q}"]`).forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); ctx.st.ans[q] = +b.dataset.j;
  });
}
function markOpts(ctx, qi, a, sel = '.opt'){
  const pick = ctx.st.ans[qi];
  ctx.el.querySelectorAll(`${sel}[data-q="${qi}"]`).forEach(x => { const j = +x.dataset.j; x.classList.remove('sel');
    if (j === a) x.classList.add('right'); else if (j === pick) x.classList.add('wrong'); });
  return pick === a;
}

const RENDER = {
  judge(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">例如: 听录音 → 判断 ★ 句子对 (✓) 还是错 (✗)</div>`) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>${spk(it.s)}
        <button class="toggle" data-show="${qi}">显示原文 show text</button></div>
        <div class="sent zh hidden" data-reveal id="tx${qi}" style="margin-top:6px">${esc(it.s)}</div>
        <div class="sent zh" style="margin-top:6px"><span class="star-mark">★</span> ${esc(it.st)}</div>
        <div class="opts"><button class="opt" data-q="${qi}" data-j="1">✓ 对</button><button class="opt" data-q="${qi}" data-j="0">✗ 错</button></div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-show]').forEach(b => b.onclick = () => el.querySelector('#tx' + b.dataset.show).classList.toggle('hidden'));
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a ? 1 : 0));
  },
  listen(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>${spk([...it.dlg, '问：' + it.q])}
        <button class="toggle" data-show="${qi}">显示对话 show dialogue</button></div>
        <div class="dlg zh hidden" data-reveal id="tx${qi}" style="margin-top:6px">${it.dlg.map(d => `<div>${esc(d)}</div>`).join('')}<div class="muted">问：${esc(it.q)}</div></div>
        <div class="opts">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-show]').forEach(b => b.onclick = () => el.querySelector('#tx' + b.dataset.show).classList.toggle('hidden'));
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a));
  },
  match(ctx){
    const {el, items, st} = ctx;
    // responses: in mistakes/inline mode include distractors from the rest of the chapter
    const allM = CH[ctx.n].ex.match; let resp = items.map(it => it.r);
    if (resp.length < 5) resp = [...resp, ...sample(allM.filter(m => !resp.includes(m.r)).map(m => m.r), 5 - resp.length)];
    st.resp ??= shuffle(resp);
    el.innerHTML = header(ctx) + `<div class="card" style="box-shadow:none;border:1.5px dashed var(--line);padding:10px 12px">${st.resp.map((r, j) => `<div class="zh" style="font-size:17px;padding:4px 0"><span class="letter">${L[j]}</span>${esc(r)} ${spk(r)}</div>`).join('')}</div>` +
      items.map((it, qi) => `<div class="q"><div class="row"><span class="qn">${qi + 1}.</span><span class="sent zh">${esc(it.q)}</span>${spk(it.q)}</div>
        <div class="opts">${st.resp.map((_, j) => `<button class="opt" data-q="${qi}" data-j="${j}">${L[j]}</button>`).join('')}</div></div>`).join('') + footer(ctx);
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, st.resp.indexOf(it.r)));
  },
  fill(ctx){
    const {el, items, st, n} = ctx;
    // workbook style: groups of 5 sentences share a bank of 6 words (A–F)
    const groups = []; for (let i = 0; i < items.length; i += 5) groups.push(items.slice(i, i + 5).map((it, j) => ({it, qi: i + j})));
    const vocabW = CH[n].vocab.map(v => v.w);
    st.banks ??= groups.map(g => { const ans = g.map(x => x.it.a); const extra = sample(vocabW.filter(w => !items.some(it => it.a === w)), Math.max(1, 6 - ans.length)); return shuffle([...ans, ...extra]); });
    el.innerHTML = header(ctx) + groups.map((g, gi) => `
      <div class="bank zh">${st.banks[gi].map((w, j) => `<span><b class="letter">${L[j]}</b>${esc(w)}</span>`).join('')}</div>
      ${g.map(({it, qi}) => `<div class="q"><div class="row" style="align-items:flex-start"><span class="qn">${qi + 1}.</span>
        <div class="sent zh" style="flex:1" id="fs${qi}">${blankify(it.s).replace(/\s{2,}|(?=B：)/, '<br>')}</div></div>
        <div class="opts">${st.banks[gi].map((w, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}" data-w="${esc(w)}">${L[j]}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('')}`).join('') + footer(ctx);
    el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { if (st.checked) return; const qi = b.dataset.q; el.querySelector(`#fs${qi} .blank`).textContent = b.dataset.w; }));
    optClicks(ctx);
    wire(ctx, (it, qi) => { const gi = Math.floor(qi / 5); return markOpts(ctx, qi, st.banks[gi].indexOf(it.a)); });
  },
  grammar(ctx){
    const {el, items, n} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span><span class="sent zh">${blankify(it.q)}</span></div>
        <div class="opts">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        <div class="fb ok hidden" data-reveal>💡 ${esc(it.exp)} ${CH[n].grammar[it.g] ? `<span class="small">（语法 ${it.g + 1}: <span class="zh">${esc(CH[n].grammar[it.g].t.split(' — ')[0])}</span>）</span>` : ''}</div></div>`).join('') + footer(ctx);
    optClicks(ctx);
    wire(ctx, (it, qi) => { const ok = markOpts(ctx, qi, it.a);
      const b = el.querySelectorAll('.q')[qi].querySelector('.blank'); if (b) b.textContent = it.opts[it.a]; return ok; });
  },
  order(ctx){
    const {el, items, st} = ctx;
    st.sh ??= items.map(it => { let s; do { s = shuffle(it.parts.map((_, j) => j)); } while (it.parts.length > 1 && s.every((x, j) => x === j)); return s; });
    items.forEach((_, qi) => st.ans[qi] ??= []);
    const draw = () => {
      el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">按正确顺序点击 A B C · Tap in the correct order</div>`) + items.map((it, qi) => `
        <div class="q"><span class="qn">${qi + 1}.</span>
          ${st.sh[qi].map((pj, j) => `<div class="row" style="margin:4px 0"><button class="chip zh ${st.ans[qi].includes(j) ? 'used' : ''}" data-q="${qi}" data-j="${j}" style="text-align:left"><span class="letter">${L[j]}</span>${esc(it.parts[pj])}</button></div>`).join('')}
          <div class="row" style="margin-top:6px"><span class="small muted">答案:</span> <b style="letter-spacing:4px" id="oa${qi}">${st.ans[qi].map(j => L[j]).join(' ') || '—'}</b>
            <button class="toggle" data-clear="${qi}">清除 clear</button></div>
          <div class="fb hidden" id="of${qi}"></div>${enLine(it.en)}</div>`).join('') + footer(ctx);
      el.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (st.checked) return; const qi = +b.dataset.q, j = +b.dataset.j; if (!st.ans[qi].includes(j)){ st.ans[qi].push(j); draw(); } });
      el.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { if (st.checked) return; st.ans[+b.dataset.clear] = []; draw(); });
      wire(ctx, (it, qi) => { const correct = it.parts.map((_, pj) => st.sh[qi].indexOf(pj));
        const ok = st.ans[qi].join() === correct.join(); const f = el.querySelector('#of' + qi);
        f.classList.remove('hidden'); f.className = 'fb ' + (ok ? 'ok' : 'no');
        f.innerHTML = `${ok ? '✓' : '✗ 正确答案 ' + correct.map(j => L[j]).join(' ')}<div class="zh" style="margin-top:4px">${esc(it.parts.join(''))} ${spk(it.parts.join(''))}</div>`; return ok; });
    };
    draw();
  },
  reading(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row" style="align-items:flex-start"><span class="qn">${qi + 1}.</span><div style="flex:1"><div class="sent zh">${esc(it.p)} ${spk(it.p)}</div>
        <div class="sent zh" style="margin-top:6px"><span class="star-mark">★</span> ${esc(it.q.replace(/^★\s*/, ''))}</div></div></div>
        <div class="opts col">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a));
  },
  write(ctx){
    const {el, items, st} = ctx;
    st.sh ??= items.map(it => { let s; do { s = shuffle(it.words.map((_, j) => j)); } while (s.every((x, j) => x === j)); return s; });
    items.forEach((_, qi) => st.ans[qi] ??= []);
    const draw = () => {
      el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">例如: 那座桥 800年的 历史 有 了 → 那座桥有800年的历史了。</div>`) + items.map((it, qi) => `
        <div class="q"><span class="qn">${qi + 1}.</span>
          <div class="chips">${st.sh[qi].map(pj => `<button class="chip zh ${st.ans[qi].includes(pj) ? 'used' : ''}" data-q="${qi}" data-p="${pj}">${esc(it.words[pj].replace(/[。？！]$/, ''))}</button>`).join('')}</div>
          <div class="build zh" style="margin-top:8px">${st.ans[qi].map((pj, pos) => `<button class="chip" data-q="${qi}" data-pos="${pos}">${esc(it.words[pj])}</button>`).join('') || '<span class="small muted">点击上面的词 tap words above</span>'}</div>
          <div class="fb hidden" id="wf${qi}"></div>${enLine(it.en)}</div>`).join('') + footer(ctx);
      el.querySelectorAll('.chip[data-p]').forEach(b => b.onclick = () => { if (st.checked) return; const qi = +b.dataset.q, pj = +b.dataset.p; if (!st.ans[qi].includes(pj)){ st.ans[qi].push(pj); draw(); } });
      el.querySelectorAll('.chip[data-pos]').forEach(b => b.onclick = () => { if (st.checked) return; st.ans[+b.dataset.q].splice(+b.dataset.pos, 1); draw(); });
      wire(ctx, (it, qi) => { const target = it.words.join(''); const got = st.ans[qi].map(j => it.words[j]).join('');
        const ok = got === target; const f = el.querySelector('#wf' + qi); f.className = 'fb ' + (ok ? 'ok' : 'no');
        f.innerHTML = `${ok ? '✓' : '✗ 正确答案:'} <span class="zh">${esc(target)}</span> ${spk(target)}`; return ok; });
    };
    draw();
  },
  hanzi(ctx){
    const {el, items, st, n} = ctx;
    const chars = [...new Set(CH[n].vocab.map(v => v.w).join('').replace(/[^\u4e00-\u9fff]/g, ''))];
    st.choices ??= items.map(it => shuffle([it.a, ...sample(chars.filter(c => c !== it.a), 3)]));
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>
        <span class="sent zh">${esc(it.s).replace(/（\s*）/, `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom"><span class="small" style="color:var(--red)">${esc(it.py)}</span><input class="hz zh" maxlength="2" data-q="${qi}" autocomplete="off" autocapitalize="off"></span>`)}</span></div>
        <div class="row small" style="margin-top:6px"><button class="toggle" data-ch="${qi}">没有中文输入法? Choose instead</button></div>
        <div class="opts hidden" id="hc${qi}">${st.choices[qi].map(c => `<button class="opt zh" data-put="${qi}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <div class="fb hidden" id="hf${qi}"></div></div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => el.querySelector('#hc' + b.dataset.ch).classList.toggle('hidden'));
    el.querySelectorAll('[data-put]').forEach(b => b.onclick = () => { if (st.checked) return; el.querySelector(`input[data-q="${b.dataset.put}"]`).value = b.dataset.c; });
    wire(ctx, (it, qi) => { const inp = el.querySelector(`input[data-q="${qi}"]`); const ok = inp.value.trim() === it.a;
      inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)'; inp.disabled = true;
      const f = el.querySelector('#hf' + qi); f.className = 'fb ' + (ok ? 'ok' : 'no');
      const full = it.s.replace(BLANK, it.a); f.innerHTML = `${ok ? '✓' : '✗ ' + esc(it.a)} · <span class="zh">${esc(full)}</span> ${spk(full)}`; return ok; });
  },
};

/* ----- review & mistakes ----- */
function review(){
  setTitle('生词复习 Review', true);
  const due = dueWords(), starred = allWords().filter(v => S.stars[wid(v.n, v.w)]);
  const studied = new Set(Object.keys(S.srs).map(k => +k.split('|')[0]));
  $('#app').innerHTML = `<div class="card"><h3>间隔复习 Spaced review</h3>
    <p class="small muted">Words you've seen in flashcards/quizzes come back after 1, 2, 4, 8, 16, 32 days. Missing a word sends it back to day 1.</p>
    <div class="row"><button class="btn primary" id="due" ${due.length ? '' : 'disabled'}>复习 ${due.length} 个到期生词</button>
    <button class="btn" id="star" ${starred.length ? '' : 'disabled'}>★ 收藏 (${starred.length})</button></div></div>
    <div class="card"><h3>混合复习 Mixed review by chapters</h3>
    <div class="row small" style="margin-bottom:8px">从 <select id="from">${DATA.map(c => `<option>${c.n}</option>`).join('')}</select> 到 <select id="to">${DATA.map(c => `<option ${c.n === Math.max(1, ...studied) ? 'selected' : ''}>${c.n}</option>`).join('')}</select> 课</div>
    <div class="row"><button class="btn" id="mix">卡片 Flashcards (20)</button></div></div>`;
  const head = `<div class="row" style="margin-bottom:10px"><a class="btn" href="#/review" style="text-decoration:none" onclick="setTimeout(route)">‹ Review</a></div>`;
  $('#due').onclick = () => flashcards(due.slice(0, 50), head);
  $('#star').onclick = () => flashcards(starred, head);
  $('#mix').onclick = () => { const a = +$('#from').value, b = +$('#to').value; flashcards(sample(allWords().filter(v => v.n >= Math.min(a, b) && v.n <= Math.max(a, b)), 20), head); };
}
/* ----- random review quiz (separate question pool: CH[n].rv) ----- */
const RV_KEYS = ['judge', 'listen', 'fill', 'grammar', 'order', 'reading', 'write', 'hanzi'];
const rvId = (n, k, i) => `${n}|${k}|${i}`;
function studiedChapters(){
  const s = new Set();
  Object.entries(S.best).forEach(([n, b]) => { if (b && Object.keys(b).length) s.add(+n); });
  Object.keys(S.srs).forEach(k => s.add(+k.split('|')[0]));
  return [...s].filter(n => CH[n]).sort((a, b) => a - b);
}
function rvPool(chs, keys){
  const out = [];
  chs.forEach(n => keys.forEach(k => (CH[n].rv?.[k] || []).forEach((_, i) => out.push({n, k, i}))));
  return out;
}
function pickReview(chs, keys, count){
  const pool = rvPool(chs, keys);
  const unseen = pool.filter(q => !S.rvSeen[rvId(q.n, q.k, q.i)]);
  // spread across chapters: round-robin over shuffled per-chapter lists
  const byCh = {}; shuffle(unseen).forEach(q => (byCh[q.n] ??= []).push(q));
  const picked = []; let order = shuffle(Object.keys(byCh));
  while (picked.length < count && order.length){
    order = order.filter(n => byCh[n].length);
    for (const n of order){ if (picked.length >= count) break; picked.push(byCh[n].shift()); }
  }
  // not enough unseen left: top up with the least-recently-seen questions (new cycle)
  if (picked.length < count){
    const seen = pool.filter(q => S.rvSeen[rvId(q.n, q.k, q.i)]).sort((a, b) => S.rvSeen[rvId(a.n, a.k, a.i)] - S.rvSeen[rvId(b.n, b.k, b.i)]);
    picked.push(...seen.slice(0, count - picked.length));
  }
  // avoid two of the same type back-to-back where possible
  const out = shuffle(picked);
  for (let i = 1; i < out.length; i++) if (out[i].k === out[i - 1].k){ const j = out.findIndex((q, x) => x > i && q.k !== out[i - 1].k); if (j > 0) [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function answeredAll(ctx){
  const {k, items, st, el} = ctx;
  return items.every((it, qi) => {
    if (k === 'hanzi') return !!el.querySelector(`input[data-q="${qi}"]`)?.value.trim();
    if (k === 'order' || k === 'write') return (st.ans[qi] || []).length === (it.parts || it.words).length;
    return st.ans[qi] != null;
  });
}
function rquizSetup(){
  setTitle('随机复习 Random review', true);
  const studied = studiedChapters();
  const set = S.set.rq ||= {scope: 'studied', from: 1, to: Math.max(1, ...studied), count: 15, listen: true};
  const hasRv = DATA.some(c => c.rv && Object.keys(c.rv).length);
  const total = rvPool(DATA.map(c => c.n), RV_KEYS).length;
  const seenN = Object.keys(S.rvSeen).length;
  $('#app').innerHTML = `<div class="card"><h3>🎲 随机复习 Random review</h3>
    <p class="small muted" style="margin-top:0">Mixed questions from the lessons you've studied, drawn from a separate review bank — not the questions in each lesson's workbook. Questions you haven't seen yet come first; once you've been through them all, the oldest come back.</p>
    ${hasRv ? '' : '<p class="small" style="color:var(--red)">The review question bank is not built yet.</p>'}
    <div style="margin:10px 0 6px" class="part-title">范围 Which lessons</div>
    <label class="row small" style="margin:6px 0"><input type="radio" name="scope" value="studied" ${set.scope === 'studied' ? 'checked' : ''}>
      已学的课 Lessons I've studied <span class="muted">${studied.length ? '(' + studied.map(n => '第' + n + '课').join('、') + ')' : '(none yet — studying a lesson\'s vocab or workbook adds it)'}</span></label>
    <label class="row small" style="margin:6px 0"><input type="radio" name="scope" value="range" ${set.scope === 'range' ? 'checked' : ''}>
      从 <select id="rf">${DATA.map(c => `<option ${c.n === set.from ? 'selected' : ''}>${c.n}</option>`).join('')}</select>
      到 <select id="rt">${DATA.map(c => `<option ${c.n === set.to ? 'selected' : ''}>${c.n}</option>`).join('')}</select> 课</label>
    <div style="margin:12px 0 6px" class="part-title">题数 Questions</div>
    <div class="row">${[10, 15, 20, 30].map(c => `<label class="small"><input type="radio" name="cnt" value="${c}" ${set.count === c ? 'checked' : ''}> ${c}</label>`).join(' ')}</div>
    <label class="row small" style="margin-top:12px"><input type="checkbox" id="rl" ${set.listen ? 'checked' : ''}> 包括听力题 Include listening (needs sound)</label>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="rgo" ${hasRv ? '' : 'disabled'}>开始 Start</button>
      <span class="small muted" id="rinfo"></span></div></div>
    <div class="card small muted">Review bank: ${seenN} of ${total} questions seen. Wrong answers are saved to the 错题本 mistakes list.
      ${seenN ? '<button class="toggle" id="rclr">重新开始 Reset seen questions</button>' : ''}</div>
    ${S.rvLog.length ? `<div class="card"><h3>最近 Recent rounds</h3>${rqHistory()}</div>` : ''}`;
  const read = () => {
    set.scope = document.querySelector('input[name=scope]:checked').value;
    set.from = +$('#rf').value; set.to = +$('#rt').value; set.count = +document.querySelector('input[name=cnt]:checked').value; set.listen = $('#rl').checked; save();
    const chs = set.scope === 'studied' ? (studied.length ? studied : [1]) : DATA.map(c => c.n).filter(n => n >= Math.min(set.from, set.to) && n <= Math.max(set.from, set.to));
    const keys = RV_KEYS.filter(k => set.listen || !['judge', 'listen'].includes(k));
    const pool = rvPool(chs, keys), unseen = pool.filter(q => !S.rvSeen[rvId(q.n, q.k, q.i)]).length;
    $('#rinfo').textContent = `${pool.length} questions available · ${unseen} not seen yet`;
    return {chs, keys};
  };
  document.querySelectorAll('input[name=scope],input[name=cnt],#rf,#rt,#rl').forEach(x => x.onchange = read);
  ['#rf', '#rt'].forEach(s => $(s).addEventListener('focus', () => { document.querySelector('input[name=scope][value=range]').checked = true; }));
  read();
  $('#rgo').onclick = () => { const {chs, keys} = read(); const qs = pickReview(chs, keys, set.count); if (!qs.length) return; rquizRun(qs); };
  const clr = $('#rclr'); if (clr) clr.onclick = () => { if (confirm('Mark all review questions as unseen?')){ S.rvSeen = {}; save(); rquizSetup(); } };
}
function rqHistory(){
  const rounds = {}; S.rvLog.forEach(r => { const d = rounds[r.r] ??= {t: r.t, ok: 0, n: 0}; d.n++; d.ok += r.ok ? 1 : 0; });
  return Object.values(rounds).sort((a, b) => b.t - a.t).slice(0, 5).map(d =>
    `<div class="row small" style="justify-content:space-between;padding:4px 0"><span>${new Date(d.t).toLocaleString()}</span>${pill(Math.round(d.ok / d.n * 100))}<span class="muted">${d.ok}/${d.n}</span></div>`).join('');
}
function rquizRun(qs){
  const round = Date.now(); let i = 0; const res = [];
  const head = () => `<div class="row small muted" style="margin-bottom:8px"><span>${Math.min(i + 1, qs.length)} / ${qs.length}</span><span style="flex:1"></span><span>✓ ${res.filter(Boolean).length}</span></div>
    <div class="bar" style="margin:-2px 0 12px"><i style="width:${i / qs.length * 100}%"></i></div>`;
  function draw(){
    setBar('');
    if (i >= qs.length) return summary();
    const q = qs[i];
    $('#app').innerHTML = head() + `<div class="small muted" style="margin-bottom:6px">第 ${q.n} 课 · <span class="zh">${esc(CH[q.n].cn)}</span></div><div class="card" id="rq"></div>`;
    runSection(q.n, q.k, $('#rq'), {only: [q.i], src: 'rv', review: true, answered: answeredAll, onGraded: (right) => {
      const ok = right > 0; res[i] = ok;
      S.rvSeen[rvId(q.n, q.k, q.i)] = Date.now();
      S.rvLog.push({r: round, t: round, n: q.n, k: q.k, i: q.i, ok}); if (S.rvLog.length > 600) S.rvLog = S.rvLog.slice(-600); save();
      setBar(`<button class="btn primary" id="rnext">${i + 1 < qs.length ? '下一题 Next ›' : '看结果 Results'}</button>`);
      $('#rnext').onclick = () => { i++; draw(); window.scrollTo(0, 0); };
    }});
    // auto-play audio for listening items
    if (q.k === 'judge' || q.k === 'listen') setTimeout(() => $('#rq .speak')?.click(), 300);
  }
  function summary(){
    const ok = res.filter(Boolean).length, pct = Math.round(ok / qs.length * 100);
    const byCh = {}; qs.forEach((q, j) => { const d = byCh[q.n] ??= {ok: 0, n: 0}; d.n++; if (res[j]) d.ok++; });
    const byK = {}; qs.forEach((q, j) => { const d = byK[q.k] ??= {ok: 0, n: 0}; d.n++; if (res[j]) d.ok++; });
    $('#app').innerHTML = `<div class="card" style="text-align:center"><div class="score">${pct}%</div><p>${ok} / ${qs.length} 对</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="ragain">再来一轮 Another round</button><a class="btn" href="#/mistakes" style="text-decoration:none">错题本 Mistakes (${S.mistakes.length})</a></div></div>
      <div class="card"><h3>按课 By lesson</h3><div class="stat-grid">${Object.keys(byCh).sort((a, b) => a - b).map(n => `<a href="#/ch/${n}">第${n}课 ${pill(Math.round(byCh[n].ok / byCh[n].n * 100))}</a>`).join('')}</div></div>
      <div class="card"><h3>按题型 By question type</h3><div class="stat-grid">${Object.keys(byK).map(k => `<a>${esc(SHORT[k])} <span class="small muted">${byK[k].ok}/${byK[k].n}</span></a>`).join('')}</div></div>`;
    $('#ragain').onclick = () => rquizSetup();
  }
  draw();
}

function mistakes(){
  setTitle('错题本 Mistakes', true);
  if (!S.mistakes.length){ $('#app').innerHTML = `<div class="card">没有错题 — no mistakes saved. Items you get wrong in the workbook land here; get them right here to clear them.</div>`; return; }
  const by = {}; S.mistakes.forEach(m => { const key = srcOf(m) + '|' + m.k; (by[m.n] ??= {}); (by[m.n][key] ??= []).push(m.i); });
  $('#app').innerHTML = Object.keys(by).sort((a, b) => a - b).map(n => Object.keys(by[n]).map(key => { const [src, k] = key.split('|');
    return `<div class="small muted" style="margin:14px 0 6px">第${n}课 · ${SECT[k].t}${src === 'rv' ? ' · 🎲 复习' : ''}</div><div class="card" id="m-${n}-${src}-${k}"></div>`; }).join('')).join('');
  Object.keys(by).forEach(n => Object.keys(by[n]).forEach(key => { const [src, k] = key.split('|'); const pool = (src === 'rv' ? CH[n].rv : CH[n].ex)?.[k] || [];
    runSection(+n, k, $(`#m-${n}-${src}-${k}`), {only: by[n][key].filter(i => pool[i]), mistakes: true, src}); }));
}
function settings(){
  setTitle('设置 Settings', true);
  const vs = VOICES.filter(v => /CN|Hans/i.test(v.lang));
  $('#app').innerHTML = `<div class="card"><h3>语音 Speech</h3>
    <div class="row">语速 Speed <input type="range" min=".5" max="1.2" step=".05" value="${S.set.rate}" id="rate"> <span id="rv">${S.set.rate}</span>
    <button class="btn" onclick="say('我最近越来越喜欢学汉语了。')">Test 🔊</button></div>
    <div class="row" style="margin-top:10px">声音 Voice <select id="voice"><option value="">Auto</option>${vs.map(v => `<option ${S.set.voice === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>
    ${vs.length ? '' : '<p class="small" style="color:var(--red)">No Chinese voice found. On Windows: Settings → Time &amp; language → Speech → add Chinese (Simplified). On iPhone: Settings → Accessibility → Spoken Content → Voices → Chinese.</p>'}
    <p class="small muted">Dialogues use a male/female voice for 男/女 where the device has both.</p></div>
    <div class="card"><h3>进度 Progress</h3>
    <p class="small muted">Progress is stored in this browser only. Export it to move between devices.</p>
    <div class="row"><button class="btn" id="exp">导出 Export</button><button class="btn" id="imp">导入 Import</button><button class="btn" id="rst" style="color:var(--red)">重置 Reset all</button></div>
    <textarea id="io" class="hidden" style="width:100%;height:120px;margin-top:10px;font-size:12px"></textarea></div>
    <div class="card small muted">Content follows the lesson structure, vocabulary and grammar points of <i>HSK Standard Course 3</i> (BLCUP) and the section format of its workbook. Sentences and exercises are original practice material, not reproduced from the books.</div>`;
  $('#rate').oninput = e => { S.set.rate = +e.target.value; $('#rv').textContent = S.set.rate; save(); };
  $('#voice').onchange = e => { S.set.voice = e.target.value; save(); };
  $('#exp').onclick = () => { const t = $('#io'); t.classList.remove('hidden'); t.value = JSON.stringify(S); t.select(); navigator.clipboard?.writeText(t.value); };
  $('#imp').onclick = () => { const t = $('#io'); if (t.classList.contains('hidden') || !t.value.trim()){ t.classList.remove('hidden'); t.value=''; t.placeholder = 'Paste exported progress here, then press Import again'; return; }
    try { S = JSON.parse(t.value); save(); alert('Imported.'); location.hash = '#/'; } catch { alert('Invalid data.'); } };
  $('#rst').onclick = () => { if (confirm('Erase all progress?')){ localStorage.removeItem(KEY); location.hash = '#/'; location.reload(); } };
}

route();
</script>
