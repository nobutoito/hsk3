<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK3">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8102e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>HSK 3 标准教程 · 练习</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e0d8;
  --red:#c8102e; --red-soft:#fbe9ec; --green:#15803d; --green-soft:#e7f6ec;
  --amber:#b45309; --amber-soft:#fff4e0; --blue:#1d4ed8; --blue-soft:#e8efff;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a; --card:#1f2226; --ink:#e8e6e3; --muted:#9aa0a6; --line:#33373d;
  --red:#ef4d63; --red-soft:#3a1d22; --green:#4ade80; --green-soft:#16301f;
  --amber:#fbbf24; --amber-soft:#35290f; --blue:#7aa2ff; --blue-soft:#1b2640;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%}
.zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","KaiTi",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
header.top{position:sticky;top:0;z-index:10;background:var(--red);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .back{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:6px 10px;color:#fff}
header.top h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .icon{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px}
header.top #home{background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;font-size:18px}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chap{display:block;text-decoration:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;border-left:5px solid var(--red)}
.chap .num{font-size:12px;color:var(--muted);letter-spacing:.05em}
.chap .cn{font-size:18px;margin:4px 0 2px}
.chap .en{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--green)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;scrollbar-width:thin}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
.tabs.wrap a{padding:6px 12px;font-size:13px}
.tabs.wrap .grp{flex-basis:100%;height:0}
.tabs a{flex:none;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.speak{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;flex:none;font-size:15px;line-height:34px;padding:0;text-align:center}
.speak.big{width:52px;height:52px;font-size:22px;line-height:52px}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sechead .roman{font-weight:700;color:var(--red)}
.part-title{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
/* vocab */
table.vocab{width:100%;border-collapse:collapse}
table.vocab td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vocab .w{font-size:22px;white-space:nowrap}
table.vocab .p{color:var(--red);white-space:nowrap}
table.vocab .pos{color:var(--muted);font-size:12px;white-space:nowrap}
.star{border:0;background:none;font-size:18px;color:var(--line);padding:2px}
.star.on{color:#f5b301}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:64px;line-height:1.1}
.flash .py{font-size:22px;color:var(--red);margin-top:8px}
.flash .def{font-size:17px;margin-top:6px}
/* questions */
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-block;min-width:24px;font-weight:600;color:var(--muted)}
.sent{font-size:19px;line-height:1.7}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:17px;text-align:left}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opts.col{flex-direction:column}
.opts.col .opt{width:100%}
.letter{display:inline-block;width:22px;font-weight:700;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:6px}
.bank span{font-size:18px}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--ink);text-align:center;padding:0 4px;color:var(--blue)}
.fb{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.en{color:var(--muted);font-size:14px;margin-top:4px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:18px}
.chip.used{opacity:.25}
.build{min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.build .chip{background:var(--card)}
.score{font-size:30px;font-weight:700}
.stickybar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:9}
.gram .pt{border-left:4px solid var(--red);padding-left:12px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ex .zh{font-size:18px}
input.hz{font-size:22px;width:70px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--card);color:var(--ink)}
.star-mark{color:var(--red);font-weight:700}
.dlg div{font-size:17px;line-height:1.7}
.toggle{font-size:13px;color:var(--blue);background:none;border:0;padding:4px 0}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi .card{flex:1;min-width:140px;margin:0;text-align:center}
.kpi .v{font-size:26px;font-weight:700}
select,input[type=range]{font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat-grid a{text-decoration:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
</style>
</head>

<script>
const DATA = [{"n":1,"cn":"周末你有什么打算","en":"What Are You Planning to Do This Weekend?","vocab":[{"w":"周末","p":"zhōumò","pos":"n.","d":"weekend"},{"w":"打算","p":"dǎsuàn","pos":"n./v.","d":"plan; to plan, intend"},{"w":"啊","p":"a","pos":"part.","d":"ah (sentence-final particle, softens tone/confirms)"},{"w":"跟","p":"gēn","pos":"prep.","d":"with"},{"w":"一直","p":"yìzhí","pos":"adv.","d":"straight on; always, continuously"},{"w":"游戏","p":"yóuxì","pos":"n.","d":"game"},{"w":"作业","p":"zuòyè","pos":"n.","d":"homework"},{"w":"着急","p":"zháojí","pos":"adj.","d":"anxious, worried"},{"w":"复习","p":"fùxí","pos":"v.","d":"to review, revise"},{"w":"南","p":"nán","pos":"n.","d":"south"},{"w":"北方","p":"běifāng","pos":"n.","d":"the north"},{"w":"面包","p":"miànbāo","pos":"n.","d":"bread"},{"w":"带","p":"dài","pos":"v.","d":"to bring, carry, take along"},{"w":"地图","p":"dìtú","pos":"n.","d":"map"},{"w":"搬","p":"bān","pos":"v.","d":"to move (house/objects)"}],"proper":"小丽 (Xiǎo Lì), 小刚 (Xiǎo Gāng) — names of people","grammar":[{"t":"结果补语 \"好\" — The Complement of Result \"好\"","m":"Verb + 好 shows an action was completed thoroughly/satisfactorily (\"done properly,\" \"all set\").","ex":[["电影票也买好了。","The movie tickets have also been bought."],["我已经准备好了。","I've already gotten ready."],["你做好作业了吗？","Have you finished your homework?"]]},{"t":"\"一…… 也/都 + 还/没……\" — The Negative Structure Expressing \"not even one/not at all\"","m":"Emphatic negation — \"not a single one\" or \"not at all.\"","ex":[["一个人也没来。","Not even one person came."],["我一点儿也不冷。","I'm not cold at all."],["这些字，我一个也不认识。","I don't recognize a single one of these characters."]]},{"t":"连词 \"那\" — The Conjunction \"那\" (\"then,\" \"in that case\")","m":"Introduces a consequence/conclusion based on what was just said.","ex":[["你不去，那我也不去了。","If you're not going, then I won't go either."],["那我们明天再说吧。","In that case, let's talk about it again tomorrow."]]}],"ex":{"judge":[{"s":"这个周末我打算跟朋友去北京玩儿，火车票已经买好了。","st":"他还没买火车票。","a":false,"en":"This weekend I plan to go to Beijing with friends; the train tickets are already bought. / He hasn't bought the train tickets yet."},{"s":"我弟弟一直在玩游戏，作业一个字也没写。","st":"弟弟还没写作业。","a":true,"en":"My younger brother has been playing games the whole time and hasn't written a single character of his homework. / The brother hasn't done his homework yet."},{"s":"明天就要考试了，可是我还没复习，真着急啊！","st":"他已经复习好了。","a":false,"en":"The exam is tomorrow, but I haven't reviewed yet — I'm really worried! / He has already finished reviewing."},{"s":"我小时候一直住在南方，去年才搬到北方来。","st":"他现在住在北方。","a":true,"en":"As a child I always lived in the south; I only moved to the north last year. / He now lives in the north."},{"s":"你去那儿别忘了带地图，那儿很大，我第一次去的时候就找不到路。","st":"说话人让对方带地图。","a":true,"en":"Don't forget to bring a map when you go there; it's big there, and I couldn't find my way the first time I went. / The speaker tells the other person to bring a map."}],"listen":[{"dlg":["男：周末你有什么打算？","女：我想在家复习，下个星期就要考试了。"],"q":"女的周末打算做什么？","opts":["去旅游","在家复习","去打球"],"a":1,"en":"M: What are your plans for the weekend? W: I want to review at home; the exam is next week. Q: What does the woman plan to do this weekend?"},{"dlg":["女：你怎么一直在玩游戏？作业做好了吗？","男：已经做好了，您看。"],"q":"关于男的，可以知道什么？","opts":["没有作业","作业太多了","作业做好了"],"a":2,"en":"W: Why do you keep playing games? Have you finished your homework? M: It's already done, have a look. Q: What do we know about the man?"},{"dlg":["男：我饿了，家里有吃的吗？","女：桌子上有面包，你先吃一点儿吧。"],"q":"男的可能会吃什么？","opts":["米饭","面条","面包"],"a":2,"en":"M: I'm hungry, is there anything to eat at home? W: There's bread on the table, eat a little first. Q: What will the man probably eat?"},{"dlg":["女：你们家搬到哪儿了？","男：搬到学校南边了，离我的公司很近。","女：那你以后上班不用坐车了。","男：是啊，走路十分钟就到了。"],"q":"男的家现在在哪儿？","opts":["学校北边","学校南边","公司旁边"],"a":1,"en":"W: Where did your family move to? M: To the south side of the school, very close to my company. W: Then you won't need to take a bus to work any more. M: Right, it's a ten-minute walk. Q: Where is the man's home now?"},{"dlg":["男：别着急，我们还有时间。","女：电影七点开始，现在已经六点五十了！"],"q":"女的为什么着急？","opts":["电影快开始了","她没买票","她找不到地图"],"a":0,"en":"M: Don't worry, we still have time. W: The movie starts at seven and it's already 6:50! Q: Why is the woman anxious?"}],"match":[{"q":"这个周末你有什么打算？","r":"我想跟朋友一起去看电影。"},{"q":"你怎么还在玩游戏？","r":"作业我已经做好了。"},{"q":"外面很冷，你多穿点儿衣服吧。","r":"没关系，我一点儿也不冷。"},{"q":"我不知道去那儿怎么走。","r":"别着急，我带地图了。"},{"q":"我今天不想出去吃饭。","r":"那我们在家做饭吧。"}],"fill":[{"s":"这个（  ）你有什么打算？","a":"周末","en":"What are your plans this weekend?"},{"s":"我（  ）明年去中国学习汉语。","a":"打算","en":"I plan to go to China next year to study Chinese."},{"s":"你（  ）往前走，就能看到医院。","a":"一直","en":"Go straight ahead and you'll see the hospital."},{"s":"我弟弟很喜欢玩电脑（  ），每天都玩两个小时。","a":"游戏","en":"My younger brother loves playing computer games; he plays two hours every day."},{"s":"我家在中国的（  ），冬天很冷。","a":"北方","en":"My home is in the north of China; winters are very cold."},{"s":"A：明天要考试了，你（  ）好了吗？  B：还没有，今天晚上还要再看看书。","a":"复习","en":"A: There's an exam tomorrow — have you finished reviewing? B: Not yet, I still need to read some more tonight."},{"s":"A：别（  ），我们还有十分钟呢。  B：好，那我们慢慢走。","a":"着急","en":"A: Don't worry, we still have ten minutes. B: OK, then let's walk slowly."},{"s":"A：我有点儿饿了。  B：桌子上有（  ），你吃吧。","a":"面包","en":"A: I'm a bit hungry. B: There's bread on the table, go ahead and eat it."},{"s":"A：你出去玩，（  ）钱了吗？  B：带了，在我的包里。","a":"带","en":"A: You're going out — did you bring money? B: Yes, it's in my bag."},{"s":"A：你（  ）家了吗？  B：搬了，现在住在学校旁边。","a":"搬","en":"A: Have you moved house? B: Yes, I live next to the school now."}],"grammar":[{"q":"电影票我已经买（  ）了，我们走吧。","opts":["着","好","去","在"],"a":1,"exp":"Verb + 好 is a result complement meaning the action is completed and ready (tickets are bought and all set).","g":0},{"q":"你准备（  ）了吗？我们要走了。","opts":["着","过","好","在"],"a":2,"exp":"准备好 = 'finished getting ready'; 好 after the verb shows the action is satisfactorily complete.","g":0},{"q":"我今天忙了一天，一口水（  ）没喝。","opts":["还","就","也","很"],"a":2,"exp":"The emphatic negation pattern is 一 + measure (+ noun) + 也/都 + 没/不: 'not even one sip'.","g":1},{"q":"这些字我（  ）个也不认识。","opts":["一","两","几","这"],"a":0,"exp":"Only 一 works in 一……也不……, which means 'not a single one'.","g":1},{"q":"A：我今天不想出去。  B：（  ）我们在家看电视吧。","opts":["因为","虽然","可是","那"],"a":3,"exp":"那 ('in that case') introduces a suggestion based on what the other person just said.","g":2},{"q":"你不想吃米饭，（  ）吃面条吧。","opts":["和","那","跟","也"],"a":1,"exp":"那 links the situation (you don't want rice) to the resulting suggestion (then have noodles).","g":2}],"order":[{"parts":["我明天要考试，","可是还一点儿也没复习，","所以今天晚上不去看电影了。"],"en":"I have an exam tomorrow, but I haven't reviewed at all, so I'm not going to the movies tonight."},{"parts":["我小时候一直住在北方，","十岁的时候跟爸爸妈妈搬到了南方，","现在已经在这儿住了十年了。"],"en":"As a child I always lived in the north; at ten I moved south with my parents, and I've now lived here for ten years."},{"parts":["这个周末天气很好，","我打算跟朋友出去玩儿，","东西我已经准备好了。"],"en":"The weather is nice this weekend; I plan to go out with friends, and I've already got everything ready."},{"parts":["你还没吃饭吧？","我买了一些面包，","你先吃一点儿吧。"],"en":"You haven't eaten yet, right? I bought some bread — have a little first."}],"reading":[{"p":"小丽这个周末打算去北京看她的朋友。火车票她已经买好了，是星期六早上八点的。她还带了一张北京地图，因为她是第一次去北京。","q":"★ 关于小丽，可以知道：","opts":["去过很多次北京","打算坐火车去北京","还没买火车票"],"a":1,"en":"Xiao Li plans to visit her friend in Beijing this weekend. She has already bought the train ticket, for 8 a.m. on Saturday. She is also bringing a map of Beijing because it's her first time going there."},{"p":"我弟弟很喜欢玩游戏。昨天晚上他一直在玩，作业一点儿也没做。今天早上他很着急，因为老师要看作业。","q":"★ 弟弟今天早上为什么着急？","opts":["起床太晚了","游戏玩不好","作业没做"],"a":2,"en":"My younger brother loves playing games. Last night he played the whole time and didn't do any homework. This morning he was very anxious because the teacher wants to check the homework."},{"p":"我小时候住在南方，那儿冬天也不冷。去年我搬到了北方，这儿的冬天很冷，常常下雪。但是我很喜欢这儿，因为可以看到雪。","q":"★ 根据这段话，可以知道说话人：","opts":["现在住在北方","不喜欢下雪","一直住在南方"],"a":0,"en":"As a child I lived in the south, where even winter isn't cold. Last year I moved to the north; winters here are cold and it often snows. But I really like it here because I can see snow."},{"p":"明天上午有考试，小刚今天晚上不跟朋友出去玩儿了，他打算在家好好儿复习。他说：“考试准备好了，玩的时候才能玩得高兴。”","q":"★ 小刚今天晚上打算做什么？","opts":["跟朋友去玩","在家复习","去学校考试"],"a":1,"en":"There's an exam tomorrow morning, so Xiao Gang isn't going out with friends tonight; he plans to review properly at home. He says: 'Only when you're ready for the exam can you really enjoy yourself when you play.'"}],"write":[{"words":["电影票","我","已经","买好了。"],"en":"I've already bought the movie tickets."},{"words":["这些字","我","一个也","不认识。"],"en":"I don't know a single one of these characters."},{"words":["这个周末","你","有什么","打算？"],"en":"What are your plans this weekend?"},{"words":["我们","一直","往前","走吧。"],"en":"Let's keep going straight ahead."},{"words":["你不去，","那","我也","不去了。"],"en":"If you're not going, then I won't go either."}],"hanzi":[{"s":"明天考试，我还没（  ）习。","py":"fù","a":"复"},{"s":"我下个月要（  ）家了。","py":"bān","a":"搬"},{"s":"你出去的时候别忘了（  ）手机。","py":"dài","a":"带"},{"s":"我家在学校的（  ）边。","py":"nán","a":"南"},{"s":"早上我吃了一个面（  ）。","py":"bāo","a":"包"}]}},{"n":2,"cn":"他什么时候回来","en":"When Will He Come Back?","vocab":[{"w":"腿","p":"tuǐ","pos":"n.","d":"leg"},{"w":"疼","p":"téng","pos":"adj.","d":"sore, painful"},{"w":"脚","p":"jiǎo","pos":"n.","d":"foot"},{"w":"树","p":"shù","pos":"n.","d":"tree"},{"w":"容易","p":"róngyì","pos":"adj.","d":"easy"},{"w":"难","p":"nán","pos":"adj.","d":"hard, difficult"},{"w":"太太","p":"tàitai","pos":"n.","d":"Mrs.; madam; wife"},{"w":"秘书","p":"mìshū","pos":"n.","d":"secretary"},{"w":"经理","p":"jīnglǐ","pos":"n.","d":"manager"},{"w":"办公室","p":"bàngōngshì","pos":"n.","d":"office"},{"w":"辆","p":"liàng","pos":"m.","d":"measure word for vehicles"},{"w":"楼","p":"lóu","pos":"n.","d":"building, floor (multi-storied)"},{"w":"拿","p":"ná","pos":"v.","d":"to take, hold, carry"},{"w":"把","p":"bǎ","pos":"m.","d":"measure word for things with a handle"},{"w":"伞","p":"sǎn","pos":"n.","d":"umbrella"},{"w":"胖","p":"pàng","pos":"adj.","d":"fat"},{"w":"其实","p":"qíshí","pos":"adv.","d":"actually, in fact"},{"w":"瘦","p":"shòu","pos":"adj.","d":"thin, skinny"}],"proper":"周 (Zhōu, surname), 周明 (Zhōu Míng, person's name)","grammar":[{"t":"简单趋向补语 — Simple Complements of Direction (来/去)","m":"来 (lái) or 去 (qù) attached after a verb shows motion toward or away from the speaker (e.g., 回来, 进去, 拿来, 带去).","ex":[["他什么时候回来？","When will he come back?"],["你把伞拿来吧。","Bring the umbrella here."],["他进去了。","He went in [away from speaker]."]]},{"t":"两个动作连续发生 — The Successive Occurrence of Two Actions","m":"Describes one action happening right after another, often with 了 marking the first action's completion.","ex":[["他下了班，就回家了。","As soon as he got off work, he went home."],["我下了课就去图书馆。","I'll go to the library right after class."]]},{"t":"反问的表达: \"能……吗?\" — The Rhetorical Question \"能……吗?\"","m":"A question form used rhetorically to imply a strong statement (often the opposite of what's asked).","ex":[["这么多东西，我一个人能拿得了吗？","Can I possibly carry all this by myself?! — implying \"I can't.\""],["你迟到了，老师能不生气吗？","You were late — how could the teacher not be angry?"]]}],"ex":{"judge":[{"s":"周经理不在办公室，他跟太太去医院了，下午两点回来。","st":"周经理下午会回来。","a":true,"en":"Manager Zhou isn't in the office; he went to the hospital with his wife and will be back at 2 p.m. / Manager Zhou will come back in the afternoon."},{"s":"我上大学的时候很瘦，这两年胖了很多。","st":"说话人一直很胖。","a":false,"en":"I was very thin in university, but I've put on a lot of weight in the last two years. / The speaker has always been fat."},{"s":"外面下雨了，我没带伞，你能送我回家吗？","st":"说话人带伞了。","a":false,"en":"It's raining outside and I didn't bring an umbrella — can you take me home? / The speaker brought an umbrella."},{"s":"学汉语其实不难，每天多听多说，就容易了。","st":"说话人觉得学汉语不太难。","a":true,"en":"Learning Chinese actually isn't hard; if you listen and speak more every day, it becomes easy. / The speaker thinks learning Chinese isn't very hard."},{"s":"我昨天走了一天的路，今天腿和脚都很疼。" ilding behind the school."},{"s":"门口有一（  ）红色的汽车。","a":"辆","en":"There's a red car at the door."},{"s":"A：外面下雨了，你带（  ）了吗？  B：带了，在包里。","a":"伞","en":"A: It's raining outside — did you bring an umbrella? B: Yes, it's in my bag."},{"s":"A：王经理在吗？  B：他不在，我是他的（  ），有什么事可以跟我说。","a":"秘书","en":"A: Is Manager Wang in? B: He's not; I'm his secretary — you can tell me what it's about."},{"s":"A：你一个月没运动，是不是（  ）了？  B：是啊，衣服都小了。","a":"胖","en":"A: You haven't exercised for a month — have you put on weight? B: Yes, my clothes have all got small."},{"s":"A：你的汉语说得真好，学了很多年了吧？  B：（  ）我只学了一年。","a":"其实","en":"A: Your Chinese is really good — you must have studied for many years? B: Actually, I've only studied for one year."},{"s":"A：你能帮我（  ）一下那本书吗？  B：好，在哪儿？","a":"拿","en":"A: Can you get that book for me? B: Sure, where is it?"}],"grammar":[{"q":"我在楼下等你，你快下（  ）吧。","opts":["去","着","来","过"],"a":2,"exp":"The speaker is downstairs, so movement toward the speaker takes 来.","g":0},{"q":"妈妈在楼上，你把这杯茶拿上（  ）给她吧。","opts":["来","去","到","了"],"a":1,"exp":"Both speakers are downstairs and the tea moves away from them, so 去 is used.","g":0},{"q":"我昨天下了课（  ）去商店了。","opts":["还","才","就","都"],"a":2,"exp":"V1了……就V2 shows the second action happened right after the first; 才 can't be followed by sentence-final 了 here.","g":1},{"q":"他下（  ）课就回家了。","opts":["了","着","过","的"],"a":0,"exp":"了 after the first verb marks its completion before the next action (下了课就……).","g":1},{"q":"这么多东西，我一个人（  ）拿得了吗？","opts":["想","要","能","在"],"a":2,"exp":"能……吗 is a rhetorical question meaning 'How could I possibly carry all this alone?'","g":2},{"q":"你不好好复习，考试（  ）考好吗？","opts":["要","能","想","让"],"a":1,"exp":"能……吗 used rhetorically implies the opposite: 'You can't possibly do well.'","g":2}],"order":[{"parts":["我昨天下了班，","就去医院看了看我的腿，","医生说没什么问题。"],"en":"Yesterday after work I went straight to the hospital to have my leg checked; the doctor said there was no problem."},{"parts":["外面下雨了，","你出去的时候","别忘了带伞。"],"en":"It's raining outside; don't forget t ":["说话人","说话人的朋友","老师"],"a":0,"en":"This is a photo taken when we were in first year. We were all young then. The one standing in the photo is me; the one sitting is my good friend."},{"p":"昨天下午有足球比赛，我们班的同学踢得很努力。比赛完了以后，大家又饿又累，一起去饭店吃了饭。","q":"★ 比赛以后，大家：","opts":["都回家了","去饭店吃饭了","又去踢球了"],"a":1,"en":"There was a football match yesterday afternoon, and our class played very hard. After the match everyone was hungry and tired, so we went to a restaurant to eat together."}],"write":[{"words":["她","又聪明","又","热情。"],"en":"She is both clever and warm."},{"words":["她","总是","笑着","跟客人说话。"],"en":"She always talks to guests with a smile."},{"words":["我","又饿","又累。"],"en":"I'm both hungry and tired."},{"words":["爸爸","喜欢","坐着","看报纸。"],"en":"Dad likes to read the newspaper sitting down."},{"words":["我弟弟","今年","上","三年级。"],"en":"My younger brother is in third grade this year."}],"hanzi":[{"s":"我中午没吃饭，现在很（  ）。","py":"è","a":"饿"},{"s":"他学习很认（  ）。","py":"zhēn","a":"真"},{"s":"这个孩子很（  ）明。","py":"cōng","a":"聪"},{"s":"他（  ）在门口等你。","py":"zhàn","a":"站"},{"s":"我去超（  ）买点儿水果。","py":"shì","a":"市"}]}},{"n":5,"cn":"我最近越来越胖了","en":"I Have Been Getting Fatter Recently","vocab":[{"w":"发烧","p":"fāshāo","pos":"v.","d":"fever; have a fever"},{"w":"为","p":"wèi","pos":"prep.","d":"for (someone/something)"},{"w":"照顾","p":"zhàogu","pos":"v.","d":"to look after"},{"w":"用","p":"yòng","pos":"v.","d":"to use"},{"w":"感冒","p":"gǎnmào","pos":"v.","d":"to catch a cold"},{"w":"季节","p":"jìjié","pos":"n.","d":"season"},{"w":"当然","p":"dāngrán","pos":"adv.","d":"of course"},{"w":"春","p":"chūn","pos":"n.","d":"spring"},{"w":"草","p":"cǎo","pos":"n.","d":"grass"},{"w":"夏","p":"xià","pos":"n.","d":"summer"},{"w":"裙子","p":"qúnzi","pos":"n.","d":"skirt"},{"w":"最近","p":"zuìjìn","pos":"adv.","d":"lately, recently"},{"w":"越","p":"yuè","pos":"adv.","d":"more, to a greater degree"}],"proper":"张 (Zhāng) — surname","grammar":[{"t":"\"了\" 表示变化 — \"了\" Indicating a Change","m":"Sentence-final 了 shows that a new situation has come about or ":"欢迎","en":"A: Welcome to my home! Come on in. B: Thanks!"},{"s":"A：你怎么又（  ）了？  B：对不起，路上车太多了。","a":"迟到","en":"A: Why are you late again? B: Sorry, there was a lot of traffic."},{"s":"A：你几点去机场？  B：我三点去（  ）我妈妈，她四点到。","a":"接","en":"A: What time are you going to the airport? B: I'm going at three to pick up my mother; she arrives at four."},{"s":"A：现在几点了？  B：八点一（  ），你快点儿吧。","a":"刻","en":"A: What time is it? B: A quarter past eight, hurry up."},{"s":"A：你对中国音乐（  ）吗？  B：当然，我特别喜欢。","a":"感兴趣","en":"A: Are you interested in Chinese music? B: Of course, I love it."}],"grammar":[{"q":"我跟他认识（  ）。","opts":["五年了","五年认识","有五年","在五年"],"a":0,"exp":"The duration phrase follows the verb: 认识 + 五年了 'have known for five years'.","g":0},{"q":"他（  ）一个小时的篮球。","opts":["打着","打了","在打","打过了"],"a":1,"exp":"V + 了 + duration (+ 的 + O) expresses how long an action lasted: 打了一个小时的篮球.","g":0},{"q":"我（  ）中国音乐很感兴趣。","opts":["跟","对","给","为"],"a":1,"exp":"The pattern is A 对 B 感兴趣 'A is interested in B'.","g":1},{"q":"我弟弟对踢足球（  ）。","opts":["不感兴趣","没兴趣感","感兴趣不","不兴趣"],"a":0,"exp":"The negative form is 对…不感兴趣; 不 goes before 感兴趣.","g":1},{"q":"现在是七点三十分，也就是七点（  ）。","opts":["一刻","差","三刻","半"],"a":3,"exp":"Thirty minutes past the hour is 半 'half past'; 一刻 is 15 minutes and 三刻 is 45.","g":2},{"q":"电影八点开始，现在是七点四十五分，就是（  ）。","opts":["七点一刻","差一刻八点","差三刻八点","八点一刻"],"a":1,"exp":"7:45 is fifteen minutes before eight: 差 + 一刻 + 八点 'a quarter to eight'.","g":2}],"order":[{"parts":["我跟小王是大学同学，","我们认识十年了，","现在又在一个公司工作。"],"en":"Xiao Wang and I were university classmates; we've known each other ten years and now work at the same company too."},{"parts":["我哥哥以前在银行工作，","去年他离开了那儿，","现在在一个大学工作。"],"en":"My brother used to work at a bank; he left last year and now works at a university."},{"parts":["我从小就对音乐很感兴趣，","我学唱歌已经十年了，","以后还想去中国学习音乐。"],"en":"I've been interested in music since I was little; I've studied singing for ten years and want to study music in China in the future."},{"parts":["明天早上九点一刻我妈妈到北京，","我八点半就去机场，","接她回家。"],"e ],["今天热极了。","It's incredibly hot today."],["听到这个消息，他高兴极了。","He was overjoyed to hear the news."]]}],"ex":{"judge":[{"s":"除了小王以外，我们班的同学都去过北京。","st":"小王去过北京。","a":false,"en":"Except for Xiao Wang, everyone in our class has been to Beijing. / Xiao Wang has been to Beijing."},{"s":"我来中国留学两年了，除了学习汉语以外，还学习了很多中国文化。","st":"他在中国学了汉语，也学了中国文化。","a":true,"en":"I've been studying in China for two years; besides Chinese, I've also learned a lot about Chinese culture. / He studied both Chinese and Chinese culture in China."},{"s":"今天的考试很简单，除了最后一个句子，其他都没什么问题。","st":"他觉得考试很难。","a":false,"en":"Today's exam was easy; apart from the last sentence, nothing else was a problem. / He thought the exam was hard."},{"s":"过这个节日的时候，街道两边都是花，漂亮极了。","st":"街道很漂亮。","a":true,"en":"During this festival both sides of the street are full of flowers — extremely beautiful. / The streets are beautiful."},{"s":"老师要求我们每天练习写汉字，这样水平才能提高。","st":"老师让他们每天写汉字。","a":true,"en":"The teacher requires us to practise writing characters every day; only then will our level improve. / The teacher has them write characters every day."}],"listen":[{"dlg":["男：你周末做什么了？","女：没做什么，在家上网看新闻。"],"q":"女的周末做了什么？","opts":["去看朋友","在家上网","去买东西"],"a":1,"en":"M: What did you do at the weekend? W: Nothing much, I stayed home reading the news online. Q: What did the woman do at the weekend?"},{"dlg":["女：你想吃点儿什么吗？","男：不用了，我刚吃完饭，饱极了。"],"q":"男的现在怎么样？","opts":["很饿","想吃东西","吃饱了"],"a":2,"en":"W: Would you like something to eat? M: No thanks, I've just eaten and I'm extremely full. Q: How is the man now?"},{"dlg":["男：你们班谁去了？","女：除了小李以外，大家都去了。"],"q":"谁没去？","opts":["小李","女的","大家"],"a":0,"en":"M: Who from your class went? W: Everyone except Xiao Li. Q: Who didn't go?"},{"dlg":["女：你的汉语水平提高得真快！","男：谢谢，我每天都练习一个小时。"],"q":"男的每天练习多长时间？","opts":["半个小时","两个小时","一个小时"],"a":2,"en":"W: Your Chinese has improved so fast! M: Thanks, I practise for an hour every day. Q: How long does the man practise each day?"},{"dlg":["男：这次考试怎么样？","女：还可以，其他都没什么问题。","男：哪儿有问题？","女：最 r than last year. Q: How many kilos was the woman last year?"},{"dlg":["女：医生，我孩子没事吧？","男：别担心，检查过了，只是感冒了，多喝水、多休息就好了。"],"q":"孩子怎么了？","opts":["感冒了","牙疼","饿了"],"a":0,"en":"W: Doctor, is my child all right? M: Don't worry, I've examined him; it's just a cold. Drink plenty of water and rest and he'll be fine. Q: What's wrong with the child?"},{"dlg":["男：你和那个穿白裙子的女孩儿是什么关系？","女：她是我姐姐，我们长得不太像。"],"q":"穿白裙子的女孩儿是谁？","opts":["女的的同学","女的的妹妹","女的的姐姐"],"a":2,"en":"M: What's your relationship with the girl in the white skirt? W: She's my older sister; we don't look very alike. Q: Who is the girl in the white skirt?"},{"dlg":["女：你每天几点睡觉？","男：最近太累了，累得下了班就想睡觉，九点就睡了。","女：那你早上几点起床？","男：六点半。"],"q":"男的最近怎么样？","opts":["生病了","很累","很高兴"],"a":1,"en":"W: What time do you go to bed every day? M: I've been so tired lately that I want to sleep as soon as I finish work; I'm asleep by nine. W: Then what time do you get up? M: Six thirty. Q: How has the man been lately?"}],"match":[{"q":"你儿子现在多高了？","r":"已经一米七了，比我还高。"},{"q":"这个小女孩儿长得真可爱！","r":"是啊，大大的眼睛，长长的头发。"},{"q":"你怎么还不睡觉？","r":"我还没刷牙呢，刷完就睡。"},{"q":"如果明天下雨，我们还去吗？","r":"下雨的话就不去了，在家看电视吧。"},{"q":"你认为这个城市怎么样？","r":"很好，环境不错，人也很热情。"}],"fill":[{"s":"今天他穿了一双黑色的（  ），看起来很帅。","a":"皮鞋","en":"Today he's wearing a pair of black leather shoes and looks very handsome."},{"s":"外面太阳很大，你出去的时候戴上（  ）吧。","a":"帽子","en":"The sun is strong outside; put on a hat when you go out."},{"s":"这只小猫又白又胖，真（  ）！","a":"可爱","en":"This kitten is white and chubby, so cute!"},{"s":"妹妹的（  ）长长的、黑黑的，非常漂亮。","a":"头发","en":"My younger sister's hair is long and black, very beautiful."},{"s":"我这个月胖了三（  ），得多运动了。","a":"公斤","en":"I've put on three kilos this month; I need to exercise more."},{"s":"A：你觉得这个（  ）怎么样？  B：我很喜欢这里，这里的人都很热情。","a":"城市","en":"A: What do you think of this city? B: I like it here a lot; the people are very friendly."},{"s":"A：你为什么每天早上和晚上都（  ）？  B：医生说这样对牙好。","a":"刷牙","en":"A: Why do you brush your teeth every morning and evening? B: The doctor says it's good for my teeth."},{"s":     const m = /^(男|女)[：:]/.exec(line); if (m){ g = m[1] === '男' ? 'm' : 'f'; t = line.slice(2); }
    t = t.replace(/[（(]\s*[）)]/g, '什么').replace(/★/g, '');
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = S.set.rate; const v = pickVoice(g); if (v) u.voice = v;
    if (g === 'm' && v && !/Yunxi|Yunyang|Kangkang|Male|Yunjian/i.test(v.name)) u.pitch = .7;
    if (g === 'f') u.pitch = 1.1;
    speechSynthesis.speak(u);
  });
}
const spk = (t, big) => `<button class="speak ${big ? 'big' : ''}" data-say='${esc(JSON.stringify(t))}' title="Play">🔊</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.preventDefault(); say(JSON.parse(b.dataset.say)); } });

/* ---------- progress ---------- */
function chapterProgress(n){
  const b = S.best[n] || {}; const keys = [...SECTIONS.map(s => s.k), 'vquiz'];
  const done = keys.reduce((a, k) => a + (b[k] ?? 0), 0);
  return Math.round(done / keys.length);
}
function setBest(n, k, pct){ S.best[n] ??= {}; S.best[n][k] = Math.max(S.best[n][k] ?? 0, pct); save(); }
function pill(p){ if (p == null) return '<span class="pill">未做</span>'; return `<span class="pill ${p >= 80 ? 'ok' : 'mid'}">${p}%</span>`; }
function addMistake(n, k, i){ if (!S.mistakes.some(m => m.n == n && m.k == k && m.i == i)){ S.mistakes.push({n, k, i}); save(); } }
function clearMistake(n, k, i){ S.mistakes = S.mistakes.filter(m => !(m.n == n && m.k == k && m.i == i)); save(); }

/* ---------- SRS (Leitner) ---------- */
const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32];
const wid = (n, w) => n + '|' + w;
function srsGrade(n, w, ok){
  const id = wid(n, w); const r = S.srs[id] || {b: 0, due: 0};
  r.b = ok ? Math.min(r.b + 1, BOX_DAYS.length - 1) : 1;
  r.due = Date.now() + BOX_DAYS[r.b] * 864e5 - 36e5; S.srs[id] = r; save();
}
function allWords(){ return DATA.flatMap(c => c.vocab.map(v => ({...v, n: c.n}))); }
function dueWords(){ const now = Date.now(); return allWords().filter(v => { const r = S.srs[wid(v.n, v.w)]; return r && r.due <= now; }); }

/* ----- vocab ----- */
function vocab(n, mode){
  const c = CH[n]; setTitle(`第${n}课 生词`, true);

    ${[['', '列表 List'], ['cards', '卡片 Flashcards'], ['quiz', '测验 Quiz']].map(([k, l]) => `<a class="btn ${ (mode||'') === k ? 'primary' : ''}" style="text-decoration:none" href="#/ch/${n}/vocab${k ? '/' + k : ''}">${l}</a>`).join('')}</div>`;

  $('#app').innerHTML = tabs(n, 'vocab') + sub + `<div class="card"><table class="vocab">${c.vocab.map((v, i) => `
    <tr><td class="small muted">${i + 1}</td><td class="w zh">${esc(v.w)}</td><td>${spk(v.w)}</td>

}

function flashcards(list, head, onDone){
  let deck = shuffle(list), i = 0, flipped = false, known = 0;
  const front = S.set.cardFront || 'hz';
  function draw(){
    if (i >= deck.length){
      $('#app').innerHTML = head + `<div class="card" style="text-align:center"><div class="score">${known}/${deck.length}</div><p>认识 known this round</p>
        <button class="btn primary" id="again">再来一遍 Again</button></div>`;
      $('#again').onclick = () => { deck = shuffle(list); i = 0; known = 0; draw(); }; onDone?.(); return;
    }
    const v = deck[i];
    const hz = `<div class="big zh">${esc(v.w)}</div>`, back = `<div class="py">${esc(v.p)}</div><div class="def">${esc(v.d)}</div><div class="small muted">${esc(v.pos)} · 第${v.n}课</div>`;
    const fr = front === 'hz' ? hz : `<div class="def" style="font-size:24px">${esc(v.d)}</div>`;
    $('#app').innerHTML = head + `
      <div class="row small muted" style="margin-bottom:6px"><span>${i + 1} / ${deck.length}</span><span style="flex:1"></span>
      正面 Front: <select id="front"><option value="hz">汉字</option><option value="en" ${front==='en'?'selected':''}>English</option></select></div>
      <div class="card flash" id="fc">${fr}${flipped ? (front === 'hz' ? back : hz + back) : '<div class="small muted" style="margin-top:14px">tap to flip</div>'}
      <div style="margin-top:12px">${spk(v.w, true)}</div></div>`;
    $('#fc').onclick = e => { if (e.target.closest('[data-say]')) return; flipped = !flipped; if (flipped) say(v.w); draw(); };
    $('#front').onchange = e => { S.set.cardFront = e.target.value; save(); flashcards(list, head, onDone); };
    setBar(flipped ? `<button class="btn" id="no">✗ 不认识 Again</button><button class="btn primary" id="yes">✓ 认识 Know it</button>` : `<button class="btn primary" id="flip">翻转 Flip</button>`);
    if (flipped){ $('#no').onclick = () => { srsGrade(v.n, v.w, false); i++; flipped = false; draw(); };
                  $('#yes').onclick = () => { srsGrade(v.n, v.w, true); known++; i++; flipped = false; draw(); }; }
    else $('#flip').onclick = () => { flipped = true; say(v.w); draw(); };
  }
  draw();
}

function makeVQ(n){
  const c = CH[n]; const pool = c.vocab.length >= 4 ? c.vocab : c.vocab.concat(CH[n - 1]?.vocab || []);
  const near = [...pool, ...(CH[n - 1]?.vocab || []), ...(CH[n + 1]?.vocab || [])];
  const uniq = (arr, f) => [...new Map(arr.map(x => [f(x), x])).values()];
  return shuffle(c.vocab).map((v, i) => {
    const type = ['hz2en', 'en2hz', 'hz2py', 'audio'][i % 4];
    const others = sample(uniq(near.filter(x => x.w !== v.w && x.d !== v.d && x.p !== v.p), x => x.w), 3);
    const opts = shuffle([v, ...others]);
    const label = x => type === 'hz2en' ? x.d : type === 'hz2py' ? x.p : x.w;
    const prompt = type === 'hz2en' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">是什么意思？</span>`
      : type === 'en2hz' ? `<span style="font-size:18px">“${esc(v.d)}”</span> <span class="muted small">用汉语怎么说？</span>`
      : type === 'hz2py' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">怎么读？ pinyin?</span>`
      : `${spk(v.w, true)} <span class="muted small">听录音，选汉字 Listen and pick</span>`;
    return {v, type, prompt, opts: opts.map(label), a: opts.indexOf(v)};
  });
}
function vquiz(n, head){
  const qs = makeVQ(n); let i = 0, right = 0, answered = false;
  function draw(){
    if (i >= qs.length){ const pct = Math.round(right / qs.length * 100); setBest(n, 'vquiz', pct);
      $('#app').innerHTML = head + `<div class="card" style="text-align:center"><div class="score">${pct}%</div><p>${right} / ${qs.length}</p><button class="btn primary" onclick="route()">再测一次 Retry</button></div>`; setBar(''); return; }
    const q = qs[i]; answered = false;
    $('#app').innerHTML = head + `<div class="card"><div class="small muted">${i + 1} / ${qs.length}</div>
      <div style="margin:14px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${q.prompt}</div>
      <div class="opts col">${q.opts.map((o, j) => `<button class="opt ${q.type === 'hz2en' ? '' : 'zh'}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    if (q.type === 'audio') setTimeout(() => say(q.v.w), 250);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true; const j = +b.dataset.j; const ok = j === q.a;
      if (ok) right++; srsGrade(n, q.v.w, ok);
      document.querySelectorAll('.opt').forEach((x, k) => { if (k === q.a) x.classList.add('right'); else if (k === j) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><span class="zh">${esc(q.v.w)}</span> ${esc(q.v.p)} — ${esc(q.v.d)}</div>`;
      if (q.type !== 'audio') say(q.v.w);
      setBar(`<button class="btn primary" id="next">下一题 Next ›</button>`); $('#next').onclick = () => { i++; setBar(''); draw(); };
    });
  }
  draw();
}

/* ----- workbook ----- */
function workbook(n, k){
  const c = CH[n]; setTitle(`第${n}课 练习册`, true);
  const secs = k ? [SECT[k]] : SECTIONS;
  let lastGrp = '';
  const sub = `<div class="tabs wrap" style="margin-top:-4px">${[['', '全部 All'], ...SECTIONS.map(s => [s.k, SHORT[s.k]])].map(([kk, l]) => `<a class="${(k||'') === kk ? 'on' : ''}" href="#/ch/${n}/wb${kk ? '/' + kk : ''}">${l}</a>`).join('')}</div>`;
  $('#app').innerHTML = tabs(n, 'wb') + sub + secs.map(s => {
    const g = s.grp !== lastGrp ? `<div class="sechead"><span class="roman">${s.roman}、</span><span class="part-title">${s.grp}</span></div>` : ''; lastGrp = s.grp;
    return g + `<div class="card" id="sec-${s.k}"></div>`; }).join('');
  secs.forEach(s => runSection(n, s.k, $('#sec-' + s.k)));
}

function runSection(n, k, el, o = {}){
  const c = CH[n]; const all = c.ex?.[k] || [];
  const idx = o.only || all.map((_, i) => i);
  const items = idx.map(i => { const it = {...all[i], _i: i};
    if (it.opts && ['listen', 'reading', 'grammar'].includes(k)){ const ord = shuffle(it.opts.map((_, j) => j)); it.opts = ord.map(j => all[i].opts[j]); it.a = ord.indexOf(all[i].a); }
    return it; });
  const s = SECT[k];
  if (!items.length){ el.innerHTML = `<div class="muted">No exercises yet.</div>`; return; }
  const st = {ans: {}, checked: false};
  const ctx = {n, k, items, st, el, s, o};
  RENDER[k](ctx);
}
function header(ctx, extra = ''){
  const {s, n, k, o} = ctx; if (o.inline) return '';
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><div class="part-title zh">${s.t}</div><div class="small muted">${s.en}</div></div>${o.mistakes ? '' : pill(S.best[n]?.[k])}</div>${extra}`;
}
function footer(ctx){
  return `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>检查 Check</button><button class="btn ghost" data-reset>重做 Redo</button><span data-score class="part-title"></span>
    ${ctx.o.inline || ctx.o.mistakes ? '' : `<label class="small muted" style="margin-left:auto"><input type="checkbox" data-en ${S.set.en ? 'checked' : ''}> English</label>`}</div>`;
}
function wire(ctx, grade){
  const {el, st, items, n, k, o} = ctx;
  el.querySelector('[data-check]').onclick = () => {
    st.checked = true; let right = 0;
    items.forEach((it, qi) => { const ok = grade(it, qi); if (ok) right++;
      if (ok) clearMistake(n, k, it._i); else addMistake(n, k, it._i); });
    const pct = Math.round(right / items.length * 100);
    if (!o.only && !o.mistakes) setBest(n, k, pct);
    el.querySelector('[data-score]').textContent = `${right} / ${items.length}`;
    el.querySelectorAll('.en').forEach(x => x.classList.remove('hidden'));
    el.querySelectorAll('[data-reveal]').forEach(x => x.classList.remove('hidden'));
  };
  el.querySelector('[data-reset]').onclick = () => RENDER[k]({...ctx, st: {ans: {}, checked: false}});
  const en = el.querySelector('[data-en]'); if (en) en.onchange = e => { S.set.en = e.target.checked; save(); el.querySelectorAll('.en').forEach(x => x.classList.toggle('hidden', !S.set.en && !ctx.st.checked)); };
}
const enLine = t => t ? `<div class="en ${S.set.en ? '' : 'hidden'}">${esc(t)}</div>` : '';
function optClicks(ctx, sel = '.opt'){
  ctx.el.querySelectorAll(sel).forEach(b => b.onclick = () => {
    if (ctx.st.checked) return; const q = b.dataset.q;
    ctx.el.querySelectorAll(`${sel}[data-q="${q}"]`).forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); ctx.st.ans[q] = +b.dataset.j;
  });
}
function markOpts(ctx, qi, a, sel = '.opt'){
  const pick = ctx.st.ans[qi];
  ctx.el.querySelectorAll(`${sel}[data-q="${qi}"]`).forEach(x => { const j = +x.dataset.j; x.classList.remove('sel');
    if (j === a) x.classList.add('right'); else if (j === pick) x.classList.add('wrong'); });
  return pick === a;
}

const RENDER = {
  judge(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">例如: 听录音 → 判断 ★ 句子对 (✓) 还是错 (✗)</div>`) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>${spk(it.s)}
        <button class="toggle" data-show="${qi}">显示原文 show text</button></div>
        <div class="sent zh hidden" data-reveal id="tx${qi}" style="margin-top:6px">${esc(it.s)}</div>
        <div class="sent zh" style="margin-top:6px"><span class="star-mark">★</span> ${esc(it.st)}</div>
        <div class="opts"><button class="opt" data-q="${qi}" data-j="1">✓ 对</button><button class="opt" data-q="${qi}" data-j="0">✗ 错</button></div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-show]').forEach(b => b.onclick = () => el.querySelector('#tx' + b.dataset.show).classList.toggle('hidden'));
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a ? 1 : 0));
  },
  listen(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>${spk([...it.dlg, '问：' + it.q])}
        <button class="toggle" data-show="${qi}">显示对话 show dialogue</button></div>
        <div class="dlg zh hidden" data-reveal id="tx${qi}" style="margin-top:6px">${it.dlg.map(d => `<div>${esc(d)}</div>`).join('')}<div class="muted">问：${esc(it.q)}</div></div>
        <div class="opts">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-show]').forEach(b => b.onclick = () => el.querySelector('#tx' + b.dataset.show).classList.toggle('hidden'));
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a));
  },
  match(ctx){
    const {el, items, st} = ctx;
    // responses: in mistakes/inline mode include distractors from the rest of the chapter
    const allM = CH[ctx.n].ex.match; let resp = items.map(it => it.r);
    if (resp.length < 5) resp = [...resp, ...sample(allM.filter(m => !resp.includes(m.r)).map(m => m.r), 5 - resp.length)];
    st.resp ??= shuffle(resp);
    el.innerHTML = header(ctx) + `<div class="card" style="box-shadow:none;border:1.5px dashed var(--line);padding:10px 12px">${st.resp.map((r, j) => `<div class="zh" style="font-size:17px;padding:4px 0"><span class="letter">${L[j]}</span>${esc(r)} ${spk(r)}</div>`).join('')}</div>` +
      items.map((it, qi) => `<div class="q"><div class="row"><span class="qn">${qi + 1}.</span><span class="sent zh">${esc(it.q)}</span>${spk(it.q)}</div>
        <div class="opts">${st.resp.map((_, j) => `<button class="opt" data-q="${qi}" data-j="${j}">${L[j]}</button>`).join('')}</div></div>`).join('') + footer(ctx);
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, st.resp.indexOf(it.r)));
  },
  fill(ctx){
    const {el, items, st, n} = ctx;
    // workbook style: groups of 5 sentences share a bank of 6 words (A–F)
    const groups = []; for (let i = 0; i < items.length; i += 5) groups.push(items.slice(i, i + 5).map((it, j) => ({it, qi: i + j})));
    const vocabW = CH[n].vocab.map(v => v.w);
    st.banks ??= groups.map(g => { const ans = g.map(x => x.it.a); const extra = sample(vocabW.filter(w => !items.some(it => it.a === w)), Math.max(1, 6 - ans.length)); return shuffle([...ans, ...extra]); });
    el.innerHTML = header(ctx) + groups.map((g, gi) => `
      <div class="bank zh">${st.banks[gi].map((w, j) => `<span><b class="letter">${L[j]}</b>${esc(w)}</span>`).join('')}</div>
      ${g.map(({it, qi}) => `<div class="q"><div class="row" style="align-items:flex-start"><span class="qn">${qi + 1}.</span>
        <div class="sent zh" style="flex:1" id="fs${qi}">${blankify(it.s).replace(/\s{2,}|(?=B：)/, '<br>')}</div></div>
        <div class="opts">${st.banks[gi].map((w, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}" data-w="${esc(w)}">${L[j]}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('')}`).join('') + footer(ctx);
    el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { if (st.checked) return; const qi = b.dataset.q; el.querySelector(`#fs${qi} .blank`).textContent = b.dataset.w; }));
    optClicks(ctx);
    wire(ctx, (it, qi) => { const gi = Math.floor(qi / 5); return markOpts(ctx, qi, st.banks[gi].indexOf(it.a)); });
  },
  grammar(ctx){
    const {el, items, n} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span><span class="sent zh">${blankify(it.q)}</span></div>
        <div class="opts">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        <div class="fb ok hidden" data-reveal>💡 ${esc(it.exp)} ${CH[n].grammar[it.g] ? `<span class="small">（语法 ${it.g + 1}: <span class="zh">${esc(CH[n].grammar[it.g].t.split(' — ')[0])}</span>）</span>` : ''}</div></div>`).join('') + footer(ctx);
    optClicks(ctx);
    wire(ctx, (it, qi) => { const ok = markOpts(ctx, qi, it.a);
      const b = el.querySelectorAll('.q')[qi].querySelector('.blank'); if (b) b.textContent = it.opts[it.a]; return ok; });
  },
  order(ctx){
    const {el, items, st} = ctx;
    st.sh ??= items.map(it => { let s; do { s = shuffle(it.parts.map((_, j) => j)); } while (it.parts.length > 1 && s.every((x, j) => x === j)); return s; });
    items.forEach((_, qi) => st.ans[qi] ??= []);
    const draw = () => {
      el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">按正确顺序点击 A B C · Tap in the correct order</div>`) + items.map((it, qi) => `
        <div class="q"><span class="qn">${qi + 1}.</span>
          ${st.sh[qi].map((pj, j) => `<div class="row" style="margin:4px 0"><button class="chip zh ${st.ans[qi].includes(j) ? 'used' : ''}" data-q="${qi}" data-j="${j}" style="text-align:left"><span class="letter">${L[j]}</span>${esc(it.parts[pj])}</button></div>`).join('')}
          <div class="row" style="margin-top:6px"><span class="small muted">答案:</span> <b style="letter-spacing:4px" id="oa${qi}">${st.ans[qi].map(j => L[j]).join(' ') || '—'}</b>
            <button class="toggle" data-clear="${qi}">清除 clear</button></div>
          <div class="fb hidden" id="of${qi}"></div>${enLine(it.en)}</div>`).join('') + footer(ctx);
      el.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (st.checked) return; const qi = +b.dataset.q, j = +b.dataset.j; if (!st.ans[qi].includes(j)){ st.ans[qi].push(j); draw(); } });
      el.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { if (st.checked) return; st.ans[+b.dataset.clear] = []; draw(); });
      wire(ctx, (it, qi) => { const correct = it.parts.map((_, pj) => st.sh[qi].indexOf(pj));
        const ok = st.ans[qi].join() === correct.join(); const f = el.querySelector('#of' + qi);
        f.classList.remove('hidden'); f.className = 'fb ' + (ok ? 'ok' : 'no');
        f.innerHTML = `${ok ? '✓' : '✗ 正确答案 ' + correct.map(j => L[j]).join(' ')}<div class="zh" style="margin-top:4px">${esc(it.parts.join(''))} ${spk(it.parts.join(''))}</div>`; return ok; });
    };
    draw();
  },
  reading(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row" style="align-items:flex-start"><span class="qn">${qi + 1}.</span><div style="flex:1"><div class="sent zh">${esc(it.p)} ${spk(it.p)}</div>
        <div class="sent zh" style="margin-top:6px"><span class="star-mark">★</span> ${esc(it.q.replace(/^★\s*/, ''))}</div></div></div>
        <div class="opts col">${it.opts.map((o, j) => `<button class="opt zh" data-q="${qi}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);
    optClicks(ctx); wire(ctx, (it, qi) => markOpts(ctx, qi, it.a));
  },
  write(ctx){
    const {el, items, st} = ctx;
    st.sh ??= items.map(it => { let s; do { s = shuffle(it.words.map((_, j) => j)); } while (s.every((x, j) => x === j)); return s; });
    items.forEach((_, qi) => st.ans[qi] ??= []);
    const draw = () => {
      el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">例如: 那座桥 800年的 历史 有 了 → 那座桥有800年的历史了。</div>`) + items.map((it, qi) => `
        <div class="q"><span class="qn">${qi + 1}.</span>
          <div class="chips">${st.sh[qi].map(pj => `<button class="chip zh ${st.ans[qi].includes(pj) ? 'used' : ''}" data-q="${qi}" data-p="${pj}">${esc(it.words[pj].replace(/[。？！]$/, ''))}</button>`).join('')}</div>
          <div class="build zh" style="margin-top:8px">${st.ans[qi].map((pj, pos) => `<button class="chip" data-q="${qi}" data-pos="${pos}">${esc(it.words[pj])}</button>`).join('') || '<span class="small muted">点击上面的词 tap words above</span>'}</div>
          <div class="fb hidden" id="wf${qi}"></div>${enLine(it.en)}</div>`).join('') + footer(ctx);
      el.querySelectorAll('.chip[data-p]').forEach(b => b.onclick = () => { if (st.checked) return; const qi = +b.dataset.q, pj = +b.dataset.p; if (!st.ans[qi].includes(pj)){ st.ans[qi].push(pj); draw(); } });
      el.querySelectorAll('.chip[data-pos]').forEach(b => b.onclick = () => { if (st.checked) return; st.ans[+b.dataset.q].splice(+b.dataset.pos, 1); draw(); });
      wire(ctx, (it, qi) => { const target = it.words.join(''); const got = st.ans[qi].map(j => it.words[j]).join('');
        const ok = got === target; const f = el.querySelector('#wf' + qi); f.className = 'fb ' + (ok ? 'ok' : 'no');
        f.innerHTML = `${ok ? '✓' : '✗ 正确答案:'} <span class="zh">${esc(target)}</span> ${spk(target)}`; return ok; });
    };
    draw();
  },
  hanzi(ctx){
    const {el, items, st, n} = ctx;
    const chars = [...new Set(CH[n].vocab.map(v => v.w).join('').replace(/[^\u4e00-\u9fff]/g, ''))];
    st.choices ??= items.map(it => shuffle([it.a, ...sample(chars.filter(c => c !== it.a), 3)]));
    el.innerHTML = header(ctx) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>
        <span class="sent zh">${esc(it.s).replace(/（\s*）/, `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom"><span class="small" style="color:var(--red)">${esc(it.py)}</span><input class="hz zh" maxlength="2" data-q="${qi}" autocomplete="off" autocapitalize="off"></span>`)}</span></div>
        <div class="row small" style="margin-top:6px"><button class="toggle" data-ch="${qi}">没有中文输入法? Choose instead</button></div>
        <div class="opts hidden" id="hc${qi}">${st.choices[qi].map(c => `<button class="opt zh" data-put="${qi}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <div class="fb hidden" id="hf${qi}"></div></div>`).join('') + footer(ctx);
    el.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => el.querySelector('#hc' + b.dataset.ch).classList.toggle('hidden'));
    el.querySelectorAll('[data-put]').forEach(b => b.onclick = () => { if (st.checked) return; el.querySelector(`input[data-q="${b.dataset.put}"]`).value = b.dataset.c; });
    wire(ctx, (it, qi) => { const inp = el.querySelector(`input[data-q="${qi}"]`); const ok = inp.value.trim() === it.a;
      inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)'; inp.disabled = true;
      const f = el.querySelector('#hf' + qi); f.className = 'fb ' + (ok ? 'ok' : 'no');
      const full = it.s.replace(BLANK, it.a); f.innerHTML = `${ok ? '✓' : '✗ ' + esc(it.a)} · <span class="zh">${esc(full)}</span> ${spk(full)}`; return ok; });
  },
};

/* ----- review & mistakes ----- */
function review(){
  setTitle('生词复习 Review', true);
  const due = dueWords(), starred = allWords().filter(v => S.stars[wid(v.n, v.w)]);
  const studied = new Set(Object.keys(S.srs).map(k => +k.split('|')[0]));
  $('#app').innerHTML = `<div class="card"><h3>间隔复习 Spaced review</h3>
    <p class="small muted">Words you've seen in flashcards/quizzes come back after 1, 2, 4, 8, 16, 32 days. Missing a word sends it back to day 1.</p>
    <div class="row"><button class="btn primary" id="due" ${due.length ? '' : 'disabled'}>复习 ${due.length} 个到期生词</button>
    <button class="btn" id="star" ${starred.length ? '' : 'disabled'}>★ 收藏 (${starred.length})</button></div></div>
    <div class="card"><h3>混合复习 Mixed review by chapters</h3>
    <div class="row small" style="margin-bottom:8px">从 <select id="from">${DATA.map(c => `<option>${c.n}</option>`).join('')}</select> 到 <select id="to">${DATA.map(c => `<option ${c.n === Math.max(1, ...studied) ? 'selected' : ''}>${c.n}</option>`).join('')}</select> 课</div>
    <div class="row"><button class="btn" id="mix">卡片 Flashcards (20)</button></div></div>`;
  const head = `<div class="row" style="margin-bottom:10px"><a class="btn" href="#/review" style="text-decoration:none" onclick="setTimeout(route)">‹ Review</a></div>`;
  $('#due').onclick = () => flashcards(due.slice(0, 50), head);
  $('#star').onclick = () => flashcards(starred, head);
  $('#mix').onclick = () => { const a = +$('#from').value, b = +$('#to').value; flashcards(sample(allWords().filter(v => v.n >= Math.min(a, b) && v.n <= Math.max(a, b)), 20), head); };
}
function mistakes(){
  setTitle('错题本 Mistakes', true);
  if (!S.mistakes.length){ $('#app').innerHTML = `<div class="card">没有错题 — no mistakes saved. Items you get wrong in the workbook land here; get them right here to clear them.</div>`; return; }
  const by = {}; S.mistakes.forEach(m => { (by[m.n] ??= {}); (by[m.n][m.k] ??= []).push(m.i); });
  $('#app').innerHTML = Object.keys(by).sort((a, b) => a - b).map(n => Object.keys(by[n]).map(k =>
    `<div class="small muted" style="margin:14px 0 6px">第${n}课 · ${SECT[k].t}</div><div class="card" id="m-${n}-${k}"></div>`).join('')).join('');
  Object.keys(by).forEach(n => Object.keys(by[n]).forEach(k => runSection(+n, k, $(`#m-${n}-${k}`), {only: by[n][k].filter(i => CH[n].ex[k][i]), mistakes: true})));
}
function settings(){
  setTitle('设置 Settings', true);
  const vs = VOICES.filter(v => /CN|Hans/i.test(v.lang));
  $('#app').innerHTML = `<div class="card"><h3>语音 Speech</h3>
    <div class="row">语速 Speed <input type="range" min=".5" max="1.2" step=".05" value="${S.set.rate}" id="rate"> <span id="rv">${S.set.rate}</span>
    <button class="btn" onclick="say('我最近越来越喜欢学汉语了。')">Test 🔊</button></div>
    <div class="row" style="margin-top:10px">声音 Voice <select id="voice"><option value="">Auto</option>${vs.map(v => `<option ${S.set.voice === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>
    ${vs.length ? '' : '<p class="small" style="color:var(--red)">No Chinese voice found. On Windows: Settings → Time &amp; language → Speech → add Chinese (Simplified). On iPhone: Settings → Accessibility → Spoken Content → Voices → Chinese.</p>'}
    <p class="small muted">Dialogues use a male/female voice for 男/女 where the device has both.</p></div>
    <div class="card"><h3>进度 Progress</h3>
    <p class="small muted">Progress is stored in this browser only. Export it to move between devices.</p>
    <div class="row"><button class="btn" id="exp">导出 Export</button><button class="btn" id="imp">导入 Import</button><button class="btn" id="rst" style="color:var(--red)">重置 Reset all</button></div>
    <textarea id="io" class="hidden" style="width:100%;height:120px;margin-top:10px;font-size:12px"></textarea></div>
    <div class="card small muted">Content follows the lesson structure, vocabulary and grammar points of <i>HSK Standard Course 3</i> (BLCUP) and the section format of its workbook. Sentences and exercises are original practice material, not reproduced from the books.</div>`;
  $('#rate').oninput = e => { S.set.rate = +e.target.value; $('#rv').textContent = S.set.rate; save(); };
  $('#voice').onchange = e => { S.set.voice = e.target.value; save(); };
  $('#exp').onclick = () => { const t = $('#io'); t.classList.remove('hidden'); t.value = JSON.stringify(S); t.select(); navigator.clipboard?.writeText(t.value); };
  $('#imp').onclick = () => { const t = $('#io'); if (t.classList.contains('hidden') || !t.value.trim()){ t.classList.remove('hidden'); t.value=''; t.placeholder = 'Paste exported progress here, then press Import again'; return; }
    try { S = JSON.parse(t.value); save(); alert('Imported.'); location.hash = '#/'; } catch { alert('Invalid data.'); } };
  $('#rst').onclick = () => { if (confirm('Erase all progress?')){ localStorage.removeItem(KEY); location.hash = '#/'; location.reload(); } };
}

route();
</script>
</body>
